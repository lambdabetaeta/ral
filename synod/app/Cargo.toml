[package]
name = "synod-app"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The desktop shell for synod — a folder, a plain-language job, a report of what changed, and undo."

[lints]
workspace = true

[[bin]]
name = "synod-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
synod = { path = ".." }
exarch = { path = "../../exarch" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
