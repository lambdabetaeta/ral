[package]
name = "synod"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An office-work delegate over one granted folder — a plain-language job, a report of what changed, and undo."

[lints]
workspace = true

[lib]
name = "synod"
path = "src/lib.rs"

[[bin]]
name = "synod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ral-core   = { path = "../core" }
exarch     = { path = "../exarch" }
vm-manager = { path = "../vm-manager" }
tauri      = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = "1"
sha2       = "0.10"
zstd       = "0.13"
tokio      = { version = "1", features = ["rt"] }

# The guest's whole network: `session::begin` writes the net wire's
# prologue and hands it to `guest_net::run` beside the control wire
# `vm-manager` already returns.  synod already links `exarch`, so this adds
# nothing to the binary that `guest-net` did not already carry.  Both
# platforms: `guest_net::device::Wire` is implemented for `UnixStream` on
# Unix and `TcpStream` on Windows, the same pretence
# `ral_core::wire::WireStream` makes for the control plane.
guest-net  = { path = "../guest-net" }
# The prologue codec `session::net_seat` writes onto the net wire before
# handing it to `guest_net::run` — `ral_daemon::packet` is deliberately
# ungated so any host process can link it; this is the one other than
# `guest-net` itself.
ral-daemon = { path = "../ral-daemon" }
