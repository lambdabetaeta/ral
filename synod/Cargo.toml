[package]
name = "synod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An office-work delegate over one granted folder — a plain-language job, a report of what changed, and undo."

[lints]
workspace = true

[lib]
name = "synod"
path = "src/lib.rs"

[[bin]]
name = "synod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The boot contract, at build time, from the crate that defines it: `build.rs`
# compares the number the guest media recorded against the one this host is
# being built with.  A build dependency rather than a normal one because the
# comparison is the *build's* business — synod's own code never asks.
ral-daemon = { path = "../ral-daemon" }

[dependencies]
ral-core   = { path = "../core" }
exarch     = { path = "../exarch" }
vm-manager = { path = "../vm-manager" }
tauri      = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = "1"
sha2       = "0.11"
tokio      = { version = "1", features = ["rt"] }

# The guest's whole network: `session::net_seat` hands the net wire beside
# the control wire `vm-manager` already returns straight to `guest_net::run`.
# synod already links `exarch`, so this adds nothing to the binary that
# `guest-net` did not already carry.  Both platforms:
# `guest_net::device::Wire` is implemented for `UnixStream` on Unix and
# `TcpStream` on Windows, the same pretence `ral_core::wire::WireStream`
# makes for the control plane.
guest-net  = { path = "../guest-net" }

# `boot::inflate` decompresses the shipped rootfs into the cache. A pure-Rust
# decoder, deliberately: only decompression is ever needed, and the C-backed
# `zstd` cannot build under a cross-check with no C toolchain for the target.
ruzstd     = "0.9"

[target.'cfg(unix)'.dependencies]
# `MachineHatchery`'s accept pump peeks a fresh dial's preamble without
# consuming it — `UnixStream::peek` is still unstable, so this is one raw
# `recv(MSG_PEEK)` call rather than a hand-rolled socket layer.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# `workspace::history::free_bytes`'s free-space probe (GetDiskFreeSpaceExW)
# and `workspace::history::lock_imp`'s advisory file lock (LockFileEx, plus
# the OVERLAPPED it takes and the ERROR_LOCK_VIOLATION a refused exclusive
# probe reports).
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
] }

[dev-dependencies]
# `test_fixture::workshop`'s per-test directory, which deletes itself.
tempfile = "3.27"
