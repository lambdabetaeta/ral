[package]
name = "synod"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An office-work delegate over one granted folder — a plain-language job, a report of what changed, and undo."

[lints]
workspace = true

[lib]
name = "synod"
path = "src/lib.rs"

[[bin]]
name = "synod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ral-core   = { path = "../core", features = ["grep", "coreutils"] }
exarch     = { path = "../exarch" }
vm-manager = { path = "../vm-manager" }
tauri      = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde      = { workspace = true }
serde_json = { workspace = true }
blake3     = "1"
tokio      = { version = "1", features = ["rt"] }

[dev-dependencies]
ctor = "1"
