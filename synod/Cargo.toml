[package]
name = "synod"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An office-work delegate over one granted folder — a plain-language job, and an honest report of what changed."

[lints]
workspace = true

[[bin]]
name = "synod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ral-core   = { path = "../core" }
exarch     = { path = "../exarch" }
vm-manager = { path = "../vm-manager" }
guest-abi  = { path = "../guest-abi" }
netgate    = { path = "../netgate" }
serde      = { workspace = true }
ts-rs      = { workspace = true }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri      = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Parsing a link the assistant wrote, so only a web or email link is ever
# handed to the system.  Already in the tree through tauri.
url        = "2"

# The live frame's network seal (`window/seal.rs`): private WebKit settings.
# Versions are the ones tauri already locks, so the tree carries one objc2.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSError", "NSKeyValueCoding", "NSObject", "NSSet", "NSString", "NSValue",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKPreferences",
    "WKUserContentController", "WKWebViewConfiguration",
] }

[dev-dependencies]
serde_json = { workspace = true }
# `test_access`'s exec entries, for the office grant's tests.
ral-core = { path = "../core", features = ["test-util"] }
exarch = { path = "../exarch", features = ["test-util"] }
# `test_fixture::workshop`'s per-test directory, which deletes itself.
tempfile = { workspace = true }
