[package]
name = "ral-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[features]
# The regex builtins (re-match / re-split / re-replace-all) are core to a
# shell, so grep is on by default.  Opt out with --no-default-features.
default = ["grep"]

# Cross-platform bundled coreutils tools.  Every uu_* listed here must
# build on every platform we target (Linux, macOS, Windows).  Tools that
# rely on Unix-only uucore modules (entries / process / signals / perms)
# live in `coreutils-unix-only` instead and are pulled in by callers via
# a target.'cfg(unix)'.dependencies override.
coreutils = [
    "dep:uucore",
    "dep:uu_ls",    "dep:uu_cat",   "dep:uu_wc",    "dep:uu_head",  "dep:uu_tail",
    "dep:uu_cp",    "dep:uu_cut",   "dep:uu_mkdir",  "dep:uu_mv",   "dep:uu_rm",
    "dep:uu_sort",  "dep:uu_tee",   "dep:uu_touch", "dep:uu_tr",
    "dep:uu_uniq",  "dep:uu_yes",   "dep:uu_basename","dep:uu_base64","dep:uu_comm",
    "dep:uu_date",  "dep:uu_df",    "dep:uu_dirname","dep:uu_du",    "dep:uu_env",
    "dep:uu_join",  "dep:uu_ln",    "dep:uu_paste", "dep:uu_printf", "dep:uu_sleep",
    "dep:uu_hostname",                 "dep:uu_mktemp", "dep:uu_nproc",
    "dep:uu_printenv","dep:uu_pwd", "dep:uu_readlink","dep:uu_realpath","dep:uu_rmdir",
    "dep:uu_seq",   "dep:uu_sha256sum","dep:uu_sha512sum","dep:uu_shuf","dep:uu_split",
                                                    "dep:uu_truncate",
    "dep:uu_uname", "dep:uu_whoami",
]
# Tools that pull in uucore::{entries, process, signals, perms} or
# otherwise depend on Unix-only platform APIs, so cannot be built on
# Windows.  Activate this feature only from a `cfg(unix)` target stanza.
coreutils-unix-only = [
    "dep:uu_id", "dep:uu_kill", "dep:uu_stat", "dep:uu_timeout",
    "dep:uu_test", "dep:uu_tac",
]
diffutils = ["dep:diffutils", "dep:same-file"]
grep      = ["dep:grep", "dep:regex", "dep:walkdir"]
ripgrep   = ["dep:ral-ripgrep-core"]

# Opt-in gate for the heavier sandbox integration tests (the macOS
# Seatbelt end-to-end fail-closed target).  Off by default so a plain
# `cargo test` skips them on hosts that cannot run the OS sandbox.
test-util = []

[dependencies]
os_pipe       = "1"
glob          = "0.3"
imbl          = { version = "7", features = ["serde"] }
regex         = { version = "1", optional = true }
shlex         = { workspace = true }
ignore        = "0.4"
tempfile      = "3.27"
serde         = { workspace = true }
serde_json    = { workspace = true }
csv           = { workspace = true }
postcard      = { version = "1", features = ["alloc"] }
anstyle-query = "1"
ariadne       = "0.6"
ral-ripgrep-core = { path = "../vendor/ripgrep-core", optional = true }
uucore        = { version = "0.9", optional = true }
uu_ls         = { version = "0.9", optional = true }
uu_cat       = { version = "0.9", optional = true }
uu_wc        = { version = "0.9", optional = true }
uu_head      = { version = "0.9", optional = true }
uu_tail      = { version = "0.9", optional = true }
uu_cp        = { version = "0.9", optional = true }
uu_cut       = { version = "0.9", optional = true }
uu_mkdir     = { version = "0.9", optional = true }
uu_mv        = { version = "0.9", optional = true }
uu_rm        = { version = "0.9", optional = true }
uu_sort      = { version = "0.9", optional = true }
uu_tee       = { version = "0.9", optional = true }
uu_touch     = { version = "0.9", optional = true }
uu_tr        = { version = "0.9", optional = true }
uu_uniq      = { version = "0.9", optional = true }
uu_yes       = { version = "0.9", optional = true }
uu_basename  = { version = "0.9", optional = true }
uu_comm      = { version = "0.9", optional = true }
uu_date      = { version = "0.9", optional = true }
uu_df        = { version = "0.9", optional = true }
uu_dirname   = { version = "0.9", optional = true }
uu_du        = { version = "0.9", optional = true }
uu_env       = { version = "0.9", optional = true }
uu_join      = { version = "0.9", optional = true }
uu_ln        = { version = "0.9", optional = true }
uu_paste     = { version = "0.9", optional = true }
uu_printf    = { version = "0.9", optional = true }
uu_sleep     = { version = "0.9", optional = true }
diffutils    = { version = "0.5", optional = true }
same-file    = { version = "1", optional = true }
grep         = { version = "0.4", optional = true }
walkdir      = { version = "2", optional = true }
uu_base64    = { version = "0.9", optional = true }
uu_hostname  = { version = "0.9", optional = true }
uu_mktemp    = { version = "0.9", optional = true }
uu_nproc     = { version = "0.9", optional = true }
uu_printenv  = { version = "0.9", optional = true }
uu_pwd       = { version = "0.9", optional = true }
uu_readlink  = { version = "0.9", optional = true }
uu_realpath  = { version = "0.9", optional = true }
uu_rmdir     = { version = "0.9", optional = true }
uu_seq       = { version = "0.9", optional = true }
uu_sha256sum = { version = "0.9", optional = true }
uu_sha512sum = { version = "0.9", optional = true }
uu_shuf      = { version = "0.9", optional = true }
uu_split     = { version = "0.9", optional = true }
uu_truncate  = { version = "0.9", optional = true }
uu_uname     = { version = "0.9", optional = true }
uu_whoami    = { version = "0.9", optional = true }

[dev-dependencies]
ctor = "1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "process", "stdio", "termios"] }
nix = { workspace = true, features = ["signal", "user", "process"] }
# Unix-only uu_* tools, activated by the `coreutils-unix-only` feature.
# Each one pulls in uucore modules (entries / process / signals / perms)
# that are themselves cfg(unix) in upstream uucore, so they cannot be
# resolved on Windows.
uu_id        = { version = "0.9", optional = true }
uu_kill      = { version = "0.9", optional = true }
uu_stat      = { version = "0.9", optional = true }
uu_timeout   = { version = "0.9", optional = true }
uu_test      = { version = "0.9", optional = true }
uu_tac       = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
ctrlc        = "3"
windows-sys  = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # ProcessPrng — OS CSPRNG for the sandbox capability token.
    "Win32_Security_Isolation",
    # AppContainer profile / LowBox SID derivation for the per-command sandbox.
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
