[package]
name = "textarea-vim"
version = "0.1.0"
edition = "2024"
# MIT only: the Vim state machine in src/lib.rs is vendored from the
# MIT-licensed `ratatui-textarea` `examples/vim.rs` (see the attribution
# header there).  The rest of the workspace is "MIT OR Apache-2.0".
license = "MIT"

[lints]
workspace = true

[dependencies]
ratatui-textarea = "0.9"
# For the shared cursor presentation: the per-mode `Style`, and positioning the
# terminal's native cursor at the editor's edit point on a `Frame`.
ratatui = "0.30"
