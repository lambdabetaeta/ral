[package]
name = "ral"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ral"

[lints]
workspace = true

[[bin]]
name = "ral"
path = "src/main.rs"

[features]
coreutils  = ["ral-core/coreutils"]
diffutils  = ["ral-core/diffutils"]
ripgrep    = ["ral-core/ripgrep"]

[dependencies]
ral-core  = { path = "../core" }
# buffer-redux: input read past an accepted line (type-ahead) carries over to
# the next readline instead of being dropped.
rustyline  = { version = "=18.0.1", features = ["buffer-redux"] }
serde_json = { workspace = true }
clap       = { workspace = true }
base64     = { workspace = true }
regex      = "1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "process", "stdio", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[package.metadata.deb]
name = "ral"
maintainer = "Alex Kavvos <alex.kavvos@bristol.ac.uk>"
copyright = "2024 Alex Kavvos"
license-file = ["../LICENSE-MIT", "4"]
extended-description = """\
ral is a shell based on algebraic effects. It provides a clean, typed
command language with first-class pipelines, structured data, and
job control. Invoked as ral-sh (a symlink installed beside it), ral is a
POSIX-bridge login shell that forwards POSIX command strings and scripts
to /bin/sh."""
depends = "$auto"
section = "shells"
priority = "optional"
maintainer-scripts = "../packaging/debian"
assets = [
    { source = "../target/release/ral",    dest = "/usr/bin/ral",    mode = "755" },
    { source = "../docs/SPEC.md",          dest = "/usr/share/doc/ral/SPEC.md",          mode = "644" },
    { source = "../docs/TUTORIAL.md",      dest = "/usr/share/doc/ral/TUTORIAL.md",       mode = "644" },
]

[build-dependencies]
ral-core = { path = "../core" }

[dev-dependencies]
ral-core = { path = "../core", features = ["test-util"] }
tempfile = "3.27"
