[package]
name = "ral"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
default-run = "ral"

[lints]
workspace = true

[[bin]]
name = "ral"
path = "src/main.rs"

[features]
coreutils  = ["ral-core/coreutils"]
diffutils  = ["ral-core/diffutils"]
ripgrep    = ["ral-core/ripgrep", "dep:tikv-jemallocator"]

[dependencies]
ral-core  = { path = "../core" }
# buffer-redux: input read past an accepted line (type-ahead) carries over to
# the next readline instead of being dropped.
rustyline  = { version = "=19.0.0", features = ["buffer-redux"] }
serde_json = { workspace = true }
clap       = { workspace = true }
clipboard  = { workspace = true }
regex      = "1"
strum      = { version = "0.28", features = ["derive"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["event", "fs", "process", "stdio", "termios"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["pty"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }

[package.metadata.deb]
name = "ral"
maintainer = "Alex Kavvos <alex.kavvos@bristol.ac.uk>"
copyright = "2024 Alex Kavvos"
license-file = ["../LICENSE-APACHE", "0"]
extended-description = """\
ral is a shell based on algebraic effects. It provides a clean, typed
command language with first-class pipelines, structured data, and
job control. Invoked as ral-sh (a symlink installed beside it), ral is a
POSIX-bridge login shell that forwards POSIX command strings and scripts
to /bin/sh."""
depends = "$auto"
section = "shells"
priority = "optional"
maintainer-scripts = "../packaging/debian"
assets = [
    { source = "../target/release/ral",    dest = "/usr/bin/ral",    mode = "755" },
    { source = "../docs/SPEC.md",          dest = "/usr/share/doc/ral/SPEC.md",          mode = "644" },
    { source = "../docs/TUTORIAL.md",      dest = "/usr/share/doc/ral/TUTORIAL.md",       mode = "644" },
    { source = "../LICENSE-APACHE", dest = "/usr/share/doc/ral/LICENSE-APACHE", mode = "644" },
    { source = "../LICENSE-MIT", dest = "/usr/share/doc/ral/LICENSE-MIT", mode = "644" },
    { source = "../NOTICE", dest = "/usr/share/doc/ral/NOTICE", mode = "644" },
]

[build-dependencies]
ral-core = { path = "../core" }

[dev-dependencies]
ctor = "1"
ral-core = { path = "../core", features = ["test-util"] }
tempfile = "3.27"
