[package]
name = "guest-net-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
guest-net = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "connect"
path = "fuzz_targets/connect.rs"
test = false
doc = false
bench = false

# Detached from the parent workspace deliberately: a `cargo-fuzz` project
# needs nightly and libfuzzer-sys, neither of which the rest of this repo
# should be made to carry just because one crate has an untrusted-input
# parser worth fuzzing.
[workspace]
