[package]
name = "guest-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The policy and the audit ledger are exarch's, not a second copy: what a
# fleet's IT department wrote in `net-policy.ral` is what the gate enforces,
# and every decision it takes lands in the same audit file.
exarch = { path = "../exarch", default-features = false }
# The frame codec is the guest's own file, linked here rather than
# reimplemented, so the two ends of the net wire cannot drift apart.
ral-daemon = { path = "../ral-daemon" }

# A sans-io TCP/IP stack: this process *is* the guest's peer, so it has to
# speak IP itself. `medium-ip` because a tun carries bare IP with no ethernet
# header; no `socket-udp`, since this crate answers no UDP traffic at all.
smoltcp = { version = "0.13", default-features = false, features = [
    "std", "medium-ip", "proto-ipv4", "socket-tcp",
] }
# The CONNECT head's HTTP/1 parse.
httparse = "1"
# `Authority` parsing for the CONNECT target — deliberately not a full URL.
http = "1"
