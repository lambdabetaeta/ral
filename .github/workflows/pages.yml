name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so Quartz can date wiki pages from git

      # tree-sitter CLI (prebuilt binary) for the examples-page highlighting.
      # `highlight` needs only the binary and the generated parser.c.
      # `generate --js-runtime native` uses the built-in QuickJS runtime, so
      # no node/bun is required on the runner.
      - name: Install tree-sitter CLI
        run: |
          curl -fsSL https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.9/tree-sitter-linux-x64.gz \
            | gunzip > /usr/local/bin/tree-sitter
          chmod +x /usr/local/bin/tree-sitter

      - name: Generate tree-sitter parser
        run: tree-sitter generate --js-runtime native
        working-directory: editors/tree-sitter-ral

      - uses: astral-sh/setup-uv@v5

      # Renders index.html, examples.html (tree-sitter), and spec.html /
      # rationale.html (markdown) into site/.  uv resolves the one dependency.
      - name: Render site
        run: uv run scripts/render-site.py

      - name: Stage install scripts
        run: |
          mkdir -p site/scripts
          cp scripts/install.sh        site/scripts/install.sh
          cp scripts/exarch-install.sh site/scripts/exarch-install.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The wiki (docs/ral-wiki) is published under site/wiki/ by Quartz v5.
      # Quartz is its own Node project, so we clone it pinned, drop in our config
      # (scripts/wiki/quartz.config.yaml), and point its build at the wiki.  The
      # dep tree and plugin set are fixed by the pinned tag + our config, so the
      # caches key on those (the package-lock.json lives only inside the clone).
      - name: Clone Quartz (v5)
        run: |
          git clone --depth 1 --branch v5.0.0 https://github.com/jackyzha0/quartz.git "$RUNNER_TEMP/quartz"
          cp scripts/wiki/quartz.config.yaml "$RUNNER_TEMP/quartz/quartz.config.yaml"

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-quartz-npm-v5.0.0

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quartz/.quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-v5.0.0-${{ hashFiles('scripts/wiki/quartz.config.yaml') }}

      - name: Build wiki (Quartz v5)
        working-directory: ${{ runner.temp }}/quartz
        run: |
          npm ci
          npx quartz plugin install
          npx quartz build -d "$GITHUB_WORKSPACE/docs/ral-wiki" -o "$GITHUB_WORKSPACE/site/wiki"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
