name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so Quartz can date wiki pages from git

      - uses: ./.github/actions/site-tools
      - uses: extractions/setup-just@v4
      - run: just site

      - name: Stage install scripts
        run: |
          mkdir -p site/scripts
          cp scripts/install.sh         site/scripts/install.sh
          cp scripts/exarch-install.ps1 site/scripts/exarch-install.ps1

      # Quartz is slow, so cache the built wiki and restore it on a hit; Pages
      # deploys all of site/, so skipping the build alone would drop the wiki.
      - name: Restore built wiki
        id: wiki-restore
        uses: actions/cache/restore@v6
        with:
          path: site/wiki
          key: wiki-${{ hashFiles('docs/ral-wiki/**', 'scripts/wiki/**') }}

      - uses: actions/setup-node@v7
        if: steps.wiki-restore.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Build wiki
        if: steps.wiki-restore.outputs.cache-hit != 'true'
        run: just wiki

      - name: Save built wiki
        if: steps.wiki-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: site/wiki
          key: ${{ steps.wiki-restore.outputs.cache-primary-key }}

      # Injected at deploy time to keep the website id out of the repo.
      - name: Inject analytics
        env:
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          tag="<script defer src=\"https://analytics.lambdabetaeta.eu/script.js\" data-website-id=\"$UMAMI_WEBSITE_ID\"></script>"
          find site -name '*.html' -exec sed -i "s#</head>#$tag</head>#" {} +

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deploy
