name: Windows
# The one job no local machine covers: real Windows test *execution*
# (a `cargo check --target x86_64-pc-windows-msvc` proves the workspace
# compiles, but never runs a test), plus exarch's Windows-only dep tree
# (windows-sys, cfg(windows) console paths) that a Unix host cannot build
# at all.  Runs on every push to main so this drift is caught continuously
# rather than only when someone remembers to dispatch it; the Linux jobs
# in ci.yml stay manual to keep Actions-minutes spend down.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build (core)
        run: cargo build -p ral-core
      - name: cargo build (ral)
        run: cargo build -p ral
      - name: cargo build (ral with grep + ripgrep)
        run: cargo build -p ral --features grep,ripgrep
      # The exact feature set build-binaries.yml's build-windows-allutils job
      # ships as ral-windows-allutils.exe; uu_timeout and the rest of
      # coreutils-unix-only (core/Cargo.toml's coreutils-unix-only feature)
      # stay out of this because that feature is cfg(unix)-gated at the
      # workspace level, not because `coreutils` itself fails to build here.
      - name: cargo build (ral with coreutils,diffutils,grep,ripgrep)
        run: cargo build -p ral --features coreutils,diffutils,grep,ripgrep
      # exarch carries cfg(windows) console paths and a windows-sys dep that
      # compile nowhere else; its default `coreutils` feature stays on the
      # Windows-buildable subset (coreutils-unix-only is cfg(unix)-gated).
      - name: cargo build (exarch)
        run: cargo build -p exarch

      # The test steps report everything they know before the job ends.
      # This is the only place the suites *run* on Windows, so a round trip
      # here costs a full CI cycle: `--no-fail-fast` keeps cargo going past
      # the first failing target within a step, and `!cancelled()` keeps the
      # job going past a failing step, so one red run names every divergence
      # rather than the first one.  A failed step still fails the job.
      - name: cargo test (core)
        if: ${{ !cancelled() }}
        run: cargo test -p ral-core --no-fail-fast
      - name: cargo test (ral)
        if: ${{ !cancelled() }}
        run: cargo test -p ral --no-fail-fast
      - name: cargo test (ral with grep + ripgrep)
        if: ${{ !cancelled() }}
        run: cargo test -p ral --features grep,ripgrep --no-fail-fast
      - name: cargo test (ral with coreutils,diffutils,grep,ripgrep)
        if: ${{ !cancelled() }}
        run: cargo test -p ral --features coreutils,diffutils,grep,ripgrep --no-fail-fast
      - name: cargo test (exarch)
        if: ${{ !cancelled() }}
        run: cargo test -p exarch --no-fail-fast
