name: CI
# Smoke checks: format, lint, build, test.  Manual only — run from the
# Actions tab or `gh workflow run ci.yml`.  Kept deliberately lean
# (single Linux runner, no cross-targets) so it stays cheap in Actions
# minutes.  Cross-target builds live in build-binaries.yml (v* tags or
# manual dispatch).  The Windows job lives in windows.yml instead,
# where it auto-runs on push to main — it is the one job no local
# machine covers.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The ref names the channel and overrides rust-toolchain.toml; keep it in
      # step with what that file tracks.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Enforces the fs/process I/O-door denylist (clippy.toml): every read,
      # write, spawn, and exec must go through a known door or carry an
      # #[allow(clippy::disallowed_methods, reason = "[io-door:…]")].  The
      # `[workspace.lints.clippy] disallowed_methods = "deny"` table makes a
      # stray constructor a build break, so no `-- -D` flag is needed (one would
      # also override the vendored ral-ripgrep-core's `all = "allow"` opt-out).
      # The closed-door-set meta-test (core/tests/io_door_set.rs) runs under
      # `cargo test` below and pins the reviewed allow set.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo build
        run: cargo build --workspace --all-targets

      # Integration tests in ral/tests/ invoke the `ral` binary as a
      # subprocess, so `cargo build` above is load-bearing — `cargo test`
      # alone does not reliably refresh that binary.
      - name: cargo test
        run: cargo test --workspace

      - uses: astral-sh/setup-uv@v9.0.0

      # Renders the whole site.  Without tree-sitter installed the examples
      # page falls back to the regex highlighter, which keeps this check cheap
      # on every PR while still catching a broken example, doc, or template.
      - name: Render site
        run: uv run scripts/render-site.py

      # plugins/*.ral are not checked here: the `_ed-*` builtins they call
      # live only on the interactive shell's table, so batch `--check`
      # cannot type them — the REPL checks each plugin as rc loads it.
      - name: Syntax-check examples
        run: |
          for f in examples/*/*.ral; do
            cargo run -p ral --quiet -- --check "$f"
          done
