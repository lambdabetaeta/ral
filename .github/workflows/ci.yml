name: CI
# Every platform runs the same `just lint test`; one more job runs the
# platform-independent `just docs ui` once.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RAL_REQUIRE_SANDBOX: '1'

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install

      # Musl, as every Linux release ships.  Ubuntu denies unprivileged user
      # namespaces by default, and bwrap needs one.
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CARGO_BUILD_TARGET=$(uname -m)-unknown-linux-musl" >> "$GITHUB_ENV"
          # jemalloc on arm64 musl: see scripts/linux-box.Dockerfile.
          echo "CFLAGS_aarch64_unknown_linux_musl=-mno-outline-atomics" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4

      - run: just lint
      - run: just test

  common:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: ./.github/actions/site-tools
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: just docs ui
