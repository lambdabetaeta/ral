name: CI
# Every platform runs the same `just lint test`; one more job runs the
# platform-independent `just docs ui` once.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RAL_REQUIRE_SANDBOX: '1'

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install

      # Musl, as every Linux release ships.  Ubuntu denies unprivileged user
      # namespaces by default, and bwrap needs one.  bubblewrap is ral's
      # floor, 0.10.0, built from its commit: no arm64 runner image ships it.
      # It predates C23, where `bool` is a keyword, hence gnu17; it goes in
      # /usr, on the `/usr/bin:/bin` PATH the test suite pins.
      - name: Prepare Linux
        if: runner.os == 'Linux'
        env:
          BWRAP_COMMIT: dc63ec667e6546f34e0b6c088cdf8ae7c7dea0f3 # v0.10.0
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools meson ninja-build pkg-config libcap-dev
          src="$RUNNER_TEMP/bubblewrap"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/containers/bubblewrap "$BWRAP_COMMIT"
          git -C "$src" checkout -q FETCH_HEAD
          meson setup "$src/build" "$src" --prefix=/usr -Dc_std=gnu17 -Dman=disabled -Dtests=false -Dselinux=disabled \
            -Dbash_completion=disabled -Dzsh_completion=disabled
          sudo meson install -C "$src/build"
          bwrap --version
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CARGO_BUILD_TARGET=$(uname -m)-unknown-linux-musl" >> "$GITHUB_ENV"
          # jemalloc on arm64 musl: see scripts/linux-box.Dockerfile.
          echo "CFLAGS_aarch64_unknown_linux_musl=-mno-outline-atomics" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4

      - run: just lint
      - run: just test

  common:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: ./.github/actions/site-tools
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: just docs ui
