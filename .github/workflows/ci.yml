name: CI
# The step list is scripts/ci.sh, the same one `just ci` and `just linux-ci`
# run, and its steps are justfile recipes.  This file only provisions the
# runner: the sandbox image the cargo steps run in, the site toolchain
# render-site.py needs, and `just` itself.
#
# Runs on a `v*` tag and on manual dispatch.  Cross-target release builds live
# in build-binaries.yml (same tags); the Windows job in windows.yml, which
# auto-runs on push to main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A bare runner's unprivileged bwrap path is unreliable (AppArmor userns
      # denial, then a mount-layer /dev fault no policy fixes), so every cargo
      # step runs privileged inside this image — exactly what `just linux-ci`
      # does locally.
      - name: Build the Linux sandbox image
        run: docker build -t ral-linux-box -f scripts/linux-box.Dockerfile scripts

      # tree-sitter CLI (prebuilt binary): render-site.py has no highlighting
      # fallback, so this is load-bearing, not optional.  Mirrors pages.yml.
      - name: Install tree-sitter CLI
        run: |
          curl -fsSL https://github.com/tree-sitter/tree-sitter/releases/download/v0.26.9/tree-sitter-linux-x64.gz \
            | gunzip > /usr/local/bin/tree-sitter
          chmod +x /usr/local/bin/tree-sitter

      - uses: astral-sh/setup-uv@v10.0.1

      # scripts/ci.sh runs its steps as justfile recipes; the cargo ones go
      # through the image above, but `just site` runs on the runner itself.
      - uses: extractions/setup-just@v4

      - name: Lint, build, test, site, examples
        run: scripts/ci.sh linux-box
