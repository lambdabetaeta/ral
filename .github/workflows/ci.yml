name: CI
# Smoke checks: lint, build, test, site, examples.  Runs on a `v*` tag and on
# manual dispatch — not on every push, so it stays cheap in Actions
# minutes; the day-to-day Linux gate is `just linux-ci`, which runs these
# same steps in dev/podman's container, the only place a macOS host
# compiles `#[cfg(target_os = "linux")]` code at all.  Cross-target builds
# live in build-binaries.yml (same `v*` tags).  The Windows job lives in
# windows.yml, where it auto-runs on push to main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # bwrap needs a real user namespace to build its sandbox without being
      # setuid-root, and a bare GitHub-hosted runner's unprivileged path
      # there has proven unreliable: Ubuntu 24.04's AppArmor policy denies
      # it outright ("setting up uid map: Permission denied"), and even
      # with that lifted, device access inside the sandbox itself broke
      # non-deterministically run to run ("/bin/sh: cannot open /dev/null:
      # Permission denied") on an otherwise-identical runner image — two
      # structurally opposite AppArmor profiles produced the identical
      # failure, and removing the restriction outright still reproduced it,
      # which rules out the profile *and* that one restriction as the cause.
      #
      # scripts/linux-box.Dockerfile + `just linux-ci` already solve this
      # for local dev by running privileged instead of fighting the
      # unprivileged path — a `--privileged` container has real
      # CAP_SYS_ADMIN and disables the AppArmor/seccomp mediation this was
      # colliding with. Do the same here rather than re-fight the bare
      # runner: build the same image, run the same steps in it.
      - name: Build the Linux sandbox image
        run: docker build -t ral-linux-box -f scripts/linux-box.Dockerfile scripts

      # Enforces the fs/process I/O-door denylist (clippy.toml): every read,
      # write, spawn, and exec must go through a known door or carry an
      # #[allow(clippy::disallowed_methods, reason = "[io-door:…]")].  The
      # `[workspace.lints.clippy] disallowed_methods = "deny"` table makes a
      # stray constructor a build break, so no `-- -D` flag is needed (one would
      # also override the vendored ral-ripgrep-core's `all = "allow"` opt-out).
      # The closed-door-set meta-test (core/tests/io_door_set.rs) runs under
      # `cargo test` below and pins the reviewed allow set.
      # synod is excluded from all three: its tauri dependency links the
      # GTK/WebKit stack, whose dev packages this image does not carry, and
      # synod ships on macOS and Windows only.  `just linux-ci` excludes it
      # for the same reason, so both Linux gates cover the same crates.
      - name: cargo clippy
        run: >
          docker run --rm --privileged --user root -e RUSTFLAGS -v "$PWD:/workspace"
          -v ral-linux-cargo:/home/dev/.cargo ral-linux-box
          cargo clippy --workspace --exclude synod --all-targets

      - name: cargo build
        run: >
          docker run --rm --privileged --user root -v "$PWD:/workspace"
          -v ral-linux-cargo:/home/dev/.cargo ral-linux-box
          cargo build --workspace --exclude synod --all-targets

      # Integration tests in ral/tests/ invoke the `ral` binary as a
      # subprocess, so `cargo build` above is load-bearing — `cargo test`
      # alone does not reliably refresh that binary.
      - name: cargo test
        run: >
          docker run --rm --privileged --user root -v "$PWD:/workspace"
          -v ral-linux-cargo:/home/dev/.cargo ral-linux-box
          cargo test --workspace --exclude synod

      - uses: astral-sh/setup-uv@v9.0.0

      # Renders the whole site.  Without tree-sitter installed the examples
      # page falls back to the regex highlighter, which keeps this check cheap
      # on every PR while still catching a broken example, doc, or template.
      # Runs on the bare runner: it needs uv/python, not the sandbox image.
      - name: Render site
        run: uv run scripts/render-site.py

      # plugins/*.ral are not checked here: the `_ed-*` builtins they call
      # live only on the interactive shell's table, so batch `--check`
      # cannot type them — the REPL checks each plugin as rc loads it.
      # Runs inside the same image as the build above so `cargo run` reuses
      # its compiled artifacts (CARGO_TARGET_DIR=/workspace/.target-linux)
      # instead of triggering a second, bare-runner build.
      - name: Syntax-check examples
        run: |
          for f in examples/*/*.ral; do
            docker run --rm --privileged --user root -v "$PWD:/workspace" \
              -v ral-linux-cargo:/home/dev/.cargo ral-linux-box \
              cargo run -p ral --quiet -- --check "$f"
          done
