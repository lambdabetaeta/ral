name: Build Binaries
# A release on a `v*` tag; a manual dispatch builds without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # `artifact: release-*` is published by the `release` job; anything else is an
  # intermediate for another job.  Every entry cross-compiles, even to its own
  # host, so the binary is always at target/<triple>/release/.
  build:
    name: ${{ matrix.out }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `-allutils` bundles coreutils, diffutils, grep and ripgrep.
          - out: ral-linux-x86_64
            artifact: release-ral-linux-x86_64
            os: ubuntu-latest
            pkg: ral
            bin: ral
            target: x86_64-unknown-linux-musl
          - out: ral-linux-x86_64-allutils
            artifact: release-ral-linux-x86_64-allutils
            os: ubuntu-latest
            pkg: ral
            bin: ral
            target: x86_64-unknown-linux-musl
            features: allutils
          - out: ral-linux-arm64
            artifact: release-ral-linux-arm64
            os: ubuntu-24.04-arm
            pkg: ral
            bin: ral
            target: aarch64-unknown-linux-musl
          # Container because jemalloc-sys (via ripgrep) fails to build on a
          # plain arm runner's aarch64-musl toolchain; cross-rs ships a working one.
          - out: ral-linux-arm64-allutils
            artifact: release-ral-linux-arm64-allutils
            os: ubuntu-latest
            container: docker://ghcr.io/cross-rs/aarch64-unknown-linux-musl:edge
            pkg: ral
            bin: ral
            target: aarch64-unknown-linux-musl
            features: allutils
          - out: ral-macos-arm64
            artifact: release-ral-macos-arm64
            os: macos-latest
            pkg: ral
            bin: ral
            target: aarch64-apple-darwin
          - out: ral-macos-arm64-allutils
            artifact: release-ral-macos-arm64-allutils
            os: macos-latest
            pkg: ral
            bin: ral
            target: aarch64-apple-darwin
            features: allutils

          # Only the MSI's payload; Windows has no system coreutils to fall back on.
          - out: ral.exe
            artifact: payload-windows
            os: windows-latest
            pkg: ral
            bin: ral.exe
            target: x86_64-pc-windows-msvc
            features: allutils

          # No `-allutils`: exarch runs its work through ral.
          - out: exarch-linux-x86_64
            artifact: release-exarch-linux-x86_64
            os: ubuntu-latest
            pkg: exarch
            bin: exarch
            target: x86_64-unknown-linux-musl
          - out: exarch-linux-arm64
            artifact: release-exarch-linux-arm64
            os: ubuntu-24.04-arm
            pkg: exarch
            bin: exarch
            target: aarch64-unknown-linux-musl
          - out: exarch-macos-arm64
            artifact: release-exarch-macos-arm64
            os: macos-latest
            pkg: exarch
            bin: exarch
            target: aarch64-apple-darwin
          - out: exarch-windows.exe
            artifact: release-exarch-windows.exe
            os: windows-latest
            pkg: exarch
            bin: exarch.exe
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The containerised entry brings its own compiler and has no sudo.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl') && !matrix.container
        run: sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          cargo build --release -p ${{ matrix.pkg }} --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          mv target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.out }}
      # The packager generates the archive's third-party notices.
      - uses: extractions/setup-just@v4
        if: startsWith(matrix.artifact, 'release-')
      - uses: taiki-e/install-action@v2
        if: startsWith(matrix.artifact, 'release-')
        with:
          tool: cargo-about@0.9.3
      - name: Package binary and legal files
        if: startsWith(matrix.artifact, 'release-')
        shell: bash
        run: |
          bash scripts/package-release.sh '${{ matrix.out }}' \
            '${{ matrix.out == 'exarch-windows.exe' && 'exarch-windows.zip' || format('{0}.tar.gz', matrix.out) }}' \
            '${{ matrix.target }}' ${{ matrix.features }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ !startsWith(matrix.artifact, 'release-') && matrix.out || matrix.out == 'exarch-windows.exe' && 'exarch-windows.zip' || format('{0}.tar.gz', matrix.out) }}
          if-no-files-found: error

  # Wraps the Windows ral build in an installer: PATH, Add/Remove Programs and
  # upgrades, which a copied .exe cannot arrange.
  #
  # WiX v7 refuses to run until its Open Source Maintenance Fee EULA is accepted
  # (`wix eula accept`).  The fee applies only to revenue-generating use above
  # US$10,000 a year, which ral is not; if that changes, see
  # https://github.com/sponsors/wixtoolset.
  msi:
    name: ral-windows.msi
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120
    # wix does not cross a .NET major version on its own; roll forward rather
    # than fail if the runner image drops the runtime it was built against.
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: payload-windows
          path: payload
      - uses: extractions/setup-just@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      # The payload's target and features, as its `build` entry has them.
      - name: Generate third-party notices
        run: just third-party ral x86_64-pc-windows-msvc THIRDPARTY-RAL allutils
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 7.0.0
          # Also gates `extension add`.
          wix eula accept wix7
          wix extension add -g WixToolset.UI.wixext/7.0.0
      - name: Build MSI
        shell: pwsh
        run: |
          # The version comes from [workspace.package] in Cargo.toml.
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'ral' }).version
          wix build packaging/wix/ral.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -bindpath packaging/wix `
            -d Version=$version `
            -d RalExe=payload/ral.exe `
            -d ThirdPartyRal=THIRDPARTY-RAL `
            -o ral-windows.msi
      - uses: actions/upload-artifact@v7
        with:
          name: release-ral-windows.msi
          path: ral-windows.msi
          if-no-files-found: error

  # Synod's guest image, bundled by `synod-bundle`.  Built natively per
  # architecture: the scripts execute guest binaries under chroot.  Only the
  # files `synod/tauri.bundle.conf.json` lists as resources are kept.
  guest-image:
    name: synod-guest-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just vm::rootfs vm::boot
      - uses: actions/upload-artifact@v7
        with:
          name: guest-image-${{ matrix.arch }}
          path: |
            vm-image/out/boot/kernel
            vm-image/out/boot/initramfs.img
            vm-image/out/boot/boot-manifest.txt
            vm-image/out/rootfs/rootfs.img.zst
            vm-image/out/rootfs/rootfs.img.sha256
          if-no-files-found: error

  # The OpenVMM that synod's .msi installs beside synod.exe.  The script holds
  # the pin and the build flags, packaging/about/ the notices' config and
  # templates, and CARGO_ABOUT their generator, so all three key the cache.
  openvmm:
    name: openvmm
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_ABOUT: cargo-about@0.9.3
    steps:
      - uses: actions/checkout@v7
      - name: Restore built OpenVMM
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            target/openvmm/openvmm.exe
            target/openvmm/LICENSE-OPENVMM
            target/openvmm/THIRDPARTY-OPENVMM
          key: openvmm-${{ env.CARGO_ABOUT }}-${{ hashFiles('scripts/build-openvmm.ps1', 'packaging/about/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.restore.outputs.cache-hit != 'true'
      # Upstream's protoc version.  The release zip keeps include/ beside bin/,
      # where protoc finds the well-known types.
      - name: Install protoc
        if: steps.restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            -Uri https://github.com/protocolbuffers/protobuf/releases/download/v27.1/protoc-27.1-win64.zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "da531c51ccd1290d8d34821f0ce4e219c7fbaa6f9825f5a3fb092a9d03fe6206") {
            throw "protoc-27.1-win64.zip checksum mismatch: $actual"
          }
          $dir = Join-Path $env:RUNNER_TEMP "protoc"
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          "PROTOC=$(Join-Path $dir 'bin\protoc.exe')" >> $env:GITHUB_ENV
      - uses: taiki-e/install-action@v2
        if: steps.restore.outputs.cache-hit != 'true'
        with:
          tool: ${{ env.CARGO_ABOUT }}
      - name: Build OpenVMM
        if: steps.restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-openvmm.ps1
      - name: Save built OpenVMM
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/openvmm/openvmm.exe
            target/openvmm/LICENSE-OPENVMM
            target/openvmm/THIRDPARTY-OPENVMM
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: openvmm
          path: |
            target/openvmm/openvmm.exe
            target/openvmm/LICENSE-OPENVMM
            target/openvmm/THIRDPARTY-OPENVMM
          if-no-files-found: error

  # Installers renamed to a version-free name, so download links stay stable.
  #
  # macOS is ad-hoc signed (carries the virtualization entitlement) but not
  # notarized: the first launch needs the context menu.  No Developer ID is
  # available in secrets.
  synod-bundle:
    name: ${{ matrix.out }}
    needs: [guest-image, openvmm]
    # A failed OpenVMM build fails only the .msi leg, at its download.
    if: ${{ !cancelled() && needs.guest-image.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: synod-windows.msi
            os: windows-latest
            arch: amd64
            bundle: msi
          - out: synod-macos-arm64.dmg
            os: macos-latest
            arch: arm64
            bundle: dmg
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: guest-image-${{ matrix.arch }}
          path: vm-image/out
      - uses: actions/download-artifact@v8
        if: runner.os == 'Windows'
        with:
          name: openvmm
          path: target/openvmm
      - name: Install the Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - uses: extractions/setup-just@v4
      - run: just synod::bundle
      - name: Name the artifact
        shell: bash
        run: |
          # Exactly one match, or `mv` of a glob would silently pick a winner.
          shopt -s nullglob
          built=(target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }})
          if [ ${#built[@]} -ne 1 ]; then
            echo "expected exactly one .${{ matrix.bundle }}, found ${#built[@]}: ${built[*]}" >&2
            exit 1
          fi
          mv "${built[0]}" "${{ matrix.out }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, msi, synod-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        run: |
          cd release
          for f in *; do sha256sum "$f" | cut -d ' ' -f 1 > "$f.sha256"; done
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: release/*
