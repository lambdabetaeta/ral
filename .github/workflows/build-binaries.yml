name: Build Binaries
# A release on a `v*` tag; a manual dispatch builds without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # `artifact: release-*` is published by the `release` job; anything else is an
  # intermediate for another job.  Every entry cross-compiles, even to its own
  # host, so the binary is always at target/<triple>/release/.
  build:
    name: ${{ matrix.out }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `-allutils` bundles coreutils, diffutils, grep and ripgrep.
          - out: ral-linux-x86_64
            artifact: release-ral-linux-x86_64
            os: ubuntu-latest
            pkg: ral
            bin: ral
            target: x86_64-unknown-linux-musl
          - out: ral-linux-x86_64-allutils
            artifact: release-ral-linux-x86_64-allutils
            os: ubuntu-latest
            pkg: ral
            bin: ral
            target: x86_64-unknown-linux-musl
            features: allutils
          - out: ral-linux-arm64
            artifact: release-ral-linux-arm64
            os: ubuntu-24.04-arm
            pkg: ral
            bin: ral
            target: aarch64-unknown-linux-musl
          # Container because jemalloc-sys (via ripgrep) fails to build on a
          # plain arm runner's aarch64-musl toolchain; cross-rs ships a working one.
          - out: ral-linux-arm64-allutils
            artifact: release-ral-linux-arm64-allutils
            os: ubuntu-latest
            container: docker://ghcr.io/cross-rs/aarch64-unknown-linux-musl:edge
            pkg: ral
            bin: ral
            target: aarch64-unknown-linux-musl
            features: allutils
          - out: ral-macos-arm64
            artifact: release-ral-macos-arm64
            os: macos-latest
            pkg: ral
            bin: ral
            target: aarch64-apple-darwin
          - out: ral-macos-arm64-allutils
            artifact: release-ral-macos-arm64-allutils
            os: macos-latest
            pkg: ral
            bin: ral
            target: aarch64-apple-darwin
            features: allutils

          # Only the MSI's payload; Windows has no system coreutils to fall back on.
          - out: ral.exe
            artifact: payload-windows
            os: windows-latest
            pkg: ral
            bin: ral.exe
            target: x86_64-pc-windows-msvc
            features: allutils

          # No `-allutils`: exarch runs its work through ral.
          - out: exarch-linux-x86_64
            artifact: release-exarch-linux-x86_64
            os: ubuntu-latest
            pkg: exarch
            bin: exarch
            target: x86_64-unknown-linux-musl
          - out: exarch-linux-arm64
            artifact: release-exarch-linux-arm64
            os: ubuntu-24.04-arm
            pkg: exarch
            bin: exarch
            target: aarch64-unknown-linux-musl
          - out: exarch-macos-arm64
            artifact: release-exarch-macos-arm64
            os: macos-latest
            pkg: exarch
            bin: exarch
            target: aarch64-apple-darwin
          - out: exarch-windows.exe
            artifact: release-exarch-windows.exe
            os: windows-latest
            pkg: exarch
            bin: exarch.exe
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The containerised entry brings its own compiler and has no sudo.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl') && !matrix.container
        run: sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          cargo build --release -p ${{ matrix.pkg }} --target ${{ matrix.target }} \
            ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          mv target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.out }}
      - name: Package binary and legal files
        if: startsWith(matrix.artifact, 'release-')
        shell: bash
        run: |
          bash scripts/package-release.sh '${{ matrix.out }}' \
            '${{ matrix.out == 'exarch-windows.exe' && 'exarch-windows.zip' || format('{0}.tar.gz', matrix.out) }}'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ !startsWith(matrix.artifact, 'release-') && matrix.out || matrix.out == 'exarch-windows.exe' && 'exarch-windows.zip' || format('{0}.tar.gz', matrix.out) }}
          if-no-files-found: error

  # Wraps the Windows ral build in an installer: PATH, Add/Remove Programs and
  # upgrades, which a copied .exe cannot arrange.
  #
  # WiX v7 refuses to run until its Open Source Maintenance Fee EULA is accepted
  # (`wix eula accept`).  The fee applies only to revenue-generating use above
  # US$10,000 a year, which ral is not; if that changes, see
  # https://github.com/sponsors/wixtoolset.
  msi:
    name: ral-windows.msi
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120
    # wix does not cross a .NET major version on its own; roll forward rather
    # than fail if the runner image drops the runtime it was built against.
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: payload-windows
          path: payload
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 7.0.0
          # Also gates `extension add`.
          wix eula accept wix7
          wix extension add -g WixToolset.UI.wixext/7.0.0
      - name: Build MSI
        shell: pwsh
        run: |
          # The version comes from [workspace.package] in Cargo.toml.
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object { $_.name -eq 'ral' }).version
          wix build packaging/wix/ral.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -bindpath packaging/wix `
            -d Version=$version `
            -d RalExe=payload/ral.exe `
            -o ral-windows.msi
      - uses: actions/upload-artifact@v7
        with:
          name: release-ral-windows.msi
          path: ral-windows.msi
          if-no-files-found: error

  # Synod's guest image, bundled by `synod-bundle`.  Built natively per
  # architecture: the scripts execute guest binaries under chroot.  Only the
  # files `synod/tauri.bundle.conf.json` lists as resources are kept.
  guest-image:
    name: synod-guest-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just vm::rootfs vm::boot
      - uses: actions/upload-artifact@v7
        with:
          name: guest-image-${{ matrix.arch }}
          path: |
            vm-image/out/boot/kernel
            vm-image/out/boot/initramfs.img
            vm-image/out/boot/boot-manifest.txt
            vm-image/out/rootfs/rootfs.img.zst
            vm-image/out/rootfs/rootfs.img.sha256
          if-no-files-found: error

  # Installers renamed to a version-free name, so download links stay stable.
  #
  # macOS is ad-hoc signed (carries the virtualization entitlement) but not
  # notarized: the first launch needs the context menu.  No Developer ID is
  # available in secrets.
  synod-bundle:
    name: ${{ matrix.out }}
    needs: guest-image
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: synod-windows.msi
            os: windows-latest
            arch: amd64
            bundle: msi
          - out: synod-macos-arm64.dmg
            os: macos-latest
            arch: arm64
            bundle: dmg
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: guest-image-${{ matrix.arch }}
          path: vm-image/out
      - name: Install the Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked
      - uses: extractions/setup-just@v4
      - run: just synod::bundle
      - name: Name the artifact
        shell: bash
        run: |
          # Exactly one match, or `mv` of a glob would silently pick a winner.
          shopt -s nullglob
          built=(target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }})
          if [ ${#built[@]} -ne 1 ]; then
            echo "expected exactly one .${{ matrix.bundle }}, found ${#built[@]}: ${built[*]}" >&2
            exit 1
          fi
          mv "${built[0]}" "${{ matrix.out }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, msi, synod-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        run: |
          cd release
          for f in *; do sha256sum "$f" | cut -d ' ' -f 1 > "$f.sha256"; done
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: release/*
