name: Build Binaries
# Builds the release matrix and publishes binaries to this repo.
# Lives on the public lambdabetaeta/ral repo.
#
#   * workflow_dispatch (manual button) → rolling `latest` prerelease
#                                          (release-latest job)
#   * push of a `v*` tag                → versioned, non-prerelease
#                                          (release-versioned job)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install musl toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release -p ral --target x86_64-unknown-linux-musl
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/ral
          if-no-files-found: error

  build-linux-x86_64-allutils:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install musl toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release -p ral --target x86_64-unknown-linux-musl --features coreutils,diffutils,grep,ripgrep
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-linux-x86_64-allutils
          path: target/x86_64-unknown-linux-musl/release/ral
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install musl toolchain
        run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release -p ral --target aarch64-unknown-linux-musl
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/ral
          if-no-files-found: error

  build-linux-arm64-allutils:
    # The `allutils` build pulls in `tikv-jemalloc-sys` (via ripgrep's
    # `vendor/ripgrep-core` on `cfg(all(target_env = "musl",
    # target_pointer_width = "64"))`). On the plain `ubuntu-24.04-arm`
    # runner with `musl-tools`, jemalloc 5.3.0's C build fails on
    # aarch64-musl with errors like
    #   include/jemalloc/internal/atomic.h:48:24: error:
    #     'atomic_memory_order_relaxed' undeclared
    # because the toolchain shipped by `musl-tools` triggers a
    # configure/atomics mismatch in jemalloc 5.3.0 on aarch64-musl
    # (fixed upstream in jemalloc 5.3.1, but `tikv-jemalloc-sys` is
    # still pinned to 5.3.0). The supported workaround — used by
    # ripgrep and yazi — is to build inside the official cross-rs
    # container, which ships a known-good `aarch64-linux-musl-gcc` and
    # sets `CC_aarch64_unknown_linux_musl` correctly for build scripts.
    # The non-allutils arm64 job above doesn't need this because no
    # jemalloc-sys is built without the `ripgrep` feature.
    runs-on: ubuntu-latest
    container:
      image: docker://ghcr.io/cross-rs/aarch64-unknown-linux-musl:edge
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Build
        run: cargo build --release -p ral --target aarch64-unknown-linux-musl --features coreutils,diffutils,grep,ripgrep
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-linux-arm64-allutils
          path: target/aarch64-unknown-linux-musl/release/ral
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --release -p ral
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-macos-arm64
          path: target/release/ral
          if-no-files-found: error

  build-macos-allutils:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --release -p ral --features coreutils,diffutils,grep,ripgrep
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-macos-arm64-allutils
          path: target/release/ral
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --release -p ral
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-windows
          path: target/release/ral.exe
          if-no-files-found: error

  build-windows-allutils:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --release -p ral --features coreutils,diffutils,grep,ripgrep
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ral-windows-allutils
          path: target/release/ral.exe
          if-no-files-found: error

  # exarch — built for Linux + macOS only (no Windows target, no
  # `coreutils,diffutils,grep,ripgrep` features — those belong to ral).  Same
  # toolchains as the ral matrix above.
  build-exarch-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install musl toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release -p exarch --target x86_64-unknown-linux-musl
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: exarch-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/exarch
          if-no-files-found: error

  build-exarch-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install musl toolchain
        run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release -p exarch --target aarch64-unknown-linux-musl
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: exarch-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/exarch
          if-no-files-found: error

  build-exarch-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: cargo build --release -p exarch
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: exarch-macos-arm64
          path: target/release/exarch
          if-no-files-found: error

  # Two publish jobs share the matrix.  They only differ in trigger
  # and the resulting tag/prerelease flag; the rename + checksum block
  # is identical, and softprops/action-gh-release uses GITHUB_TOKEN
  # implicitly to publish to the repo that owns the workflow.

  release-latest:
    needs: &build_jobs
      - build-linux-x86_64
      - build-linux-x86_64-allutils
      - build-linux-arm64
      - build-linux-arm64-allutils
      - build-macos
      - build-macos-allutils
      - build-windows
      - build-windows-allutils
      - build-exarch-linux-x86_64
      - build-exarch-linux-arm64
      - build-exarch-macos
    # Rolling `latest` prerelease: manual dispatch only.
    # Tag pushes go to release-versioned below.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/ral-linux-x86_64/ral             artifacts/ral-linux-x86_64/ral-linux-x86_64
          mv artifacts/ral-linux-x86_64-allutils/ral    artifacts/ral-linux-x86_64-allutils/ral-linux-x86_64-allutils
          mv artifacts/ral-linux-arm64/ral              artifacts/ral-linux-arm64/ral-linux-arm64
          mv artifacts/ral-linux-arm64-allutils/ral     artifacts/ral-linux-arm64-allutils/ral-linux-arm64-allutils
          mv artifacts/ral-macos-arm64/ral              artifacts/ral-macos-arm64/ral-macos-arm64
          mv artifacts/ral-macos-arm64-allutils/ral     artifacts/ral-macos-arm64-allutils/ral-macos-arm64-allutils
          mv artifacts/ral-windows/ral.exe              artifacts/ral-windows/ral-windows.exe
          mv artifacts/ral-windows-allutils/ral.exe     artifacts/ral-windows-allutils/ral-windows-allutils.exe
          mv artifacts/exarch-linux-x86_64/exarch       artifacts/exarch-linux-x86_64/exarch-linux-x86_64
          mv artifacts/exarch-linux-arm64/exarch        artifacts/exarch-linux-arm64/exarch-linux-arm64
          mv artifacts/exarch-macos-arm64/exarch        artifacts/exarch-macos-arm64/exarch-macos-arm64

      - name: Generate checksums
        run: |
          find artifacts -type f | while read -r f; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      - name: Publish 'latest' prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: latest
          prerelease: true
          fail_on_unmatched_files: true
          files: &release_files |
            artifacts/ral-linux-x86_64/ral-linux-x86_64
            artifacts/ral-linux-x86_64/ral-linux-x86_64.sha256
            artifacts/ral-linux-x86_64-allutils/ral-linux-x86_64-allutils
            artifacts/ral-linux-x86_64-allutils/ral-linux-x86_64-allutils.sha256
            artifacts/ral-linux-arm64/ral-linux-arm64
            artifacts/ral-linux-arm64/ral-linux-arm64.sha256
            artifacts/ral-linux-arm64-allutils/ral-linux-arm64-allutils
            artifacts/ral-linux-arm64-allutils/ral-linux-arm64-allutils.sha256
            artifacts/ral-macos-arm64/ral-macos-arm64
            artifacts/ral-macos-arm64/ral-macos-arm64.sha256
            artifacts/ral-macos-arm64-allutils/ral-macos-arm64-allutils
            artifacts/ral-macos-arm64-allutils/ral-macos-arm64-allutils.sha256
            artifacts/ral-windows/ral-windows.exe
            artifacts/ral-windows/ral-windows.exe.sha256
            artifacts/ral-windows-allutils/ral-windows-allutils.exe
            artifacts/ral-windows-allutils/ral-windows-allutils.exe.sha256
            artifacts/exarch-linux-x86_64/exarch-linux-x86_64
            artifacts/exarch-linux-x86_64/exarch-linux-x86_64.sha256
            artifacts/exarch-linux-arm64/exarch-linux-arm64
            artifacts/exarch-linux-arm64/exarch-linux-arm64.sha256
            artifacts/exarch-macos-arm64/exarch-macos-arm64
            artifacts/exarch-macos-arm64/exarch-macos-arm64.sha256

  release-versioned:
    needs: *build_jobs
    # Versioned, non-prerelease cut on `v*` tag push.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/ral-linux-x86_64/ral             artifacts/ral-linux-x86_64/ral-linux-x86_64
          mv artifacts/ral-linux-x86_64-allutils/ral    artifacts/ral-linux-x86_64-allutils/ral-linux-x86_64-allutils
          mv artifacts/ral-linux-arm64/ral              artifacts/ral-linux-arm64/ral-linux-arm64
          mv artifacts/ral-linux-arm64-allutils/ral     artifacts/ral-linux-arm64-allutils/ral-linux-arm64-allutils
          mv artifacts/ral-macos-arm64/ral              artifacts/ral-macos-arm64/ral-macos-arm64
          mv artifacts/ral-macos-arm64-allutils/ral     artifacts/ral-macos-arm64-allutils/ral-macos-arm64-allutils
          mv artifacts/ral-windows/ral.exe              artifacts/ral-windows/ral-windows.exe
          mv artifacts/ral-windows-allutils/ral.exe     artifacts/ral-windows-allutils/ral-windows-allutils.exe
          mv artifacts/exarch-linux-x86_64/exarch       artifacts/exarch-linux-x86_64/exarch-linux-x86_64
          mv artifacts/exarch-linux-arm64/exarch        artifacts/exarch-linux-arm64/exarch-linux-arm64
          mv artifacts/exarch-macos-arm64/exarch        artifacts/exarch-macos-arm64/exarch-macos-arm64

      - name: Generate checksums
        run: |
          find artifacts -type f | while read -r f; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      - name: Publish versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          fail_on_unmatched_files: true
          files: *release_files
