# The shell's own output goes through `outln!` / `errln!` (crate::terminal),
# which drop a failed write: once the terminal hangs up, `println!` and
# `eprintln!` panic on EIO or EPIPE.  A site that is not the shell's own
# output (a tool's `--help`, a test) `#[allow]`s with a reason opening `[test]`
# or `[silent:<slug>]`.
disallowed-macros = [
    { path = "std::println", reason = "Use ral_core::outln!, which drops a failed write rather than panicking on EPIPE." },
    { path = "std::eprintln", reason = "Use ral_core::errln!, which drops a failed write rather than panicking on EPIPE." },
]
