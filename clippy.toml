    { path = "std::fs::canonicalize", reason = "A name resolves in one place: crate::path::{walk, RealPath::of}, where the grant judges the object the walk opens." },
    { path = "std::env::current_dir", reason = "Use Shell::cwd(). Process CWD is OS-global and races every parallel ral thread; caching it in a shell-scoped store is how PWD went stale across thunks." },
    { path = "std::env::set_current_dir", reason = "ral's `cd` mutates Shell::logical_cwd, not the process cwd. A process-cwd write is subprocess setup only." },
    { path = "std::path::Path::new", reason = "Use a named helper in crate::path (is_absolute / exists / basename / path_within_str / …) so the resolution rule lives in one place. FFI glue and env-var lifting #[allow] with a reason." },
    { path = "std::path::Path::starts_with", reason = "Use RealPath::contains (a position holding another) or Rendered::holds (a kernel name holding a spelling); a containment of two paths decides authority only in crate::path." },
    { path = "std::path::Path::strip_prefix", reason = "Use RealPath::relative_to (a position past a root) or Rendered::rebased (a kernel name moved from one mount to another); a rebasing of two paths happens only in crate::path." },
    { path = "std::path::Path::ancestors", reason = "Use RealPath::ancestors_within (the positions between a root and a leaf); an ancestor walk of two paths happens only in crate::path." },
