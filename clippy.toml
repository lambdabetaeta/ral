    { path = "cap_primitives::fs::open_dir", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::open_dir_nofollow", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::open_parent_dir", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::read_base_dir", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::read_dir", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::read_link", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::read_link_contents", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::remove_dir", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::remove_dir_all", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::remove_file", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::remove_open_dir", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::remove_open_dir_all", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::rename", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::reopen", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::set_permissions", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::set_symlink_permissions", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::set_times", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::set_times_nofollow", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::stat", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::symlink", allow-invalid = true, reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::symlink_contents", allow-invalid = true, reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::symlink_dir", allow-invalid = true, reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::symlink_file", allow-invalid = true, reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "std::process::Command::new", reason = "The model's external exec is the site at crate::process::Launch::new that surfaces an exec card; sandbox respawn, which probes and infra subprocesses are reasoned-silent." },
    { path = "os_pipe::pipe", reason = "Use crate::process::cloexec_pipe — Apple sets CLOEXEC after pipe(), and a concurrent fork on another thread inherits the window." },
    { path = "std::os::unix::net::UnixStream::pair", reason = "Use crate::process::cloexec_socketpair — same window." },
    { path = "std::process::Command::spawn", reason = "Use crate::process::spawn; see spawn_lock.rs." },
    { path = "std::process::Command::output", reason = "Use crate::process::output — spawns under the lock and waits outside it; see spawn_lock.rs." },
    { path = "std::process::Command::status", reason = "Use crate::process::status — spawns under the lock and waits outside it; see spawn_lock.rs." },
    { path = "std::os::unix::process::CommandExt::exec", allow-invalid = true, reason = "An exec image replaces the process, so it must be a reviewed site. The sandbox respawn exec is silent: the surface fired before the handoff." },
    { path = "std::net::TcpStream::connect", reason = "A host:port is an outside name and the socket is the capability — the same shape as an open. Every dial is a reviewed site." },
    { path = "std::net::TcpStream::connect_timeout", reason = "The bounded dial. A separate path: clippy does not fold it into connect." },
    { path = "std::net::TcpListener::bind", reason = "A bound port is an inbound capability. The loopback wire pair and the OAuth callback receiver #[allow] with a reason." },
    { path = "std::net::UdpSocket::bind", reason = "Same ground as TcpListener::bind. No site holds one today, so the first is a decision rather than an import." },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "Resolution turns the name into the addresses the dial is judged against. The CONNECT proxy's vet is the one site." },
    { path = "reqwest::Client::builder", reason = "An HTTPS client is a dial door. Build it from exarch::provider::tls, whose bundled roots work where the host ships no trust store." },
    { path = "reqwest::Client::new", reason = "The same door with the host's trust store and no liveness bounds — never what this tree wants." },
    { path = "std::process::exit", reason = "exit runs no destructor: a held TerminalLease is never returned, a watched child never reaped, an atomic write's staged sibling never unlinked. #[allow] with a reason naming the fact that makes exiting safe here — not that it is top-level." },
    { path = "std::process::abort", reason = "Same missing destructors as exit, plus SIGABRT and no atexit flush. #[allow] with a reason saying why crashing beats any recovery." },
    { path = "std::sync::Mutex::lock", reason = "Use crate::sync::LockExt::lock_ignore_poison — poison marks an unrelated panic, and propagating it disables the lock for every later run rather than the one that panicked. A lock whose guarded state restates something outside the process (a frame boundary, a file offset) is the exception and #[allow]s with a reason saying what tears." },
    { path = "std::sync::RwLock::read", reason = "Use crate::sync::RwLockExt::read_ignore_poison — a reader tears nothing, so there is never a reason to refuse one." },
    { path = "std::sync::RwLock::write", reason = "Use crate::sync::RwLockExt::write_ignore_poison — same policy as Mutex::lock above; an exception #[allow]s with a reason saying what tears." },
    { path = "std::sync::Condvar::wait", reason = "Use crate::sync::CondvarExt::wait_ignore_poison — wait re-acquires the mutex, so it is a second acquisition of the same lock and must answer poison the way lock_ignore_poison does. An exception #[allow]s with a reason saying what tears." },
    { path = "std::sync::Condvar::wait_timeout", reason = "Use crate::sync::CondvarExt::wait_timeout_ignore_poison — same door, and the WaitTimeoutResult is handed back unchanged." },
    { path = "std::sync::Condvar::wait_while", reason = "No door yet: no site needs one. Add wait_while_ignore_poison to crate::sync rather than reaching past the policy." },
    { path = "std::sync::Condvar::wait_timeout_while", reason = "No door yet, on the same terms as wait_while above." },
    { path = "std::sync::Mutex::into_inner", reason = "Use crate::sync::LockExt::into_inner_ignore_poison — into_inner consumes the mutex, so the caller is its sole owner: poison can only record a panic that already finished, and there is no live writer left to tear anything." },
    { path = "std::sync::RwLock::into_inner", reason = "No door yet: no site needs one. Add into_inner_ignore_poison to RwLockExt rather than reaching past the policy." },
]
