# Path-handling discipline: every canonicalisation goes through
# `core::path::canon`, where it picks `canonicalise_strict` or
# `canonicalise_lenient` and names its intent at the call site.
#
# A direct `std::fs::canonicalize` elsewhere bypasses that
# distinction and re-opens the bypass-by-direct-call class of
# bugs the path/ consolidation closed.  The two real callers in
# `core/src/path/canon.rs` carry an `#[allow(clippy::disallowed_methods)]`
# attribute so the lint fires only outside that file.
#
# Path-construction discipline: every place that builds a path
# from a string goes through a named helper in `core::path` so
# the resolution rule (cwd anchoring, sigil expansion, alias
# matching, basename extraction, …) is visible at one call site.
# `std::path::Path::new` is the stdlib constructor that turns a
# borrowed string into a borrowed path; banning it outside
# `core/src/path/` keeps caller code from quietly reimplementing
# path semantics.  Construction sites inside the path/ module
# carry per-function `#[allow]` attributes; legitimate adapter
# sites elsewhere (FFI glue, env-var lifting, user-input literal
# paths) carry the same attribute with a reason at the call site.
#
# `std::path::PathBuf::from` is *not* lint-enforced because it
# resolves through the `From` trait, which clippy cannot scope to
# a single impl — adding it raises a "does not refer to a
# reachable function" warning and the lint never fires.  The
# discipline still applies (own PathBuf construction belongs in
# `crate::path`), but the enforcement is by review, not clippy.
#
# CWD discipline: process CWD is OS-global and races every parallel
# ral thread; reading it should go through `Shell::cwd` so a `within`
# override or a prior `cd` is honoured, and writing it is reserved
# for genuine subprocess setup.  Logical shell cwd lives on
# `Shell::logical_cwd`; `cd` mutates that, not the process.
#
# Genuine syscall sites carry an `#[allow]` so the lint fires only
# outside them:
#
# Reads (`std::env::current_dir`):
#   * `crate::path::process_cwd` — the single accessor that returns
#     the kernel value as a fallback for shell-less callers.
#
# Writes (`std::env::set_current_dir`):
#   * `crate::evaluator::pipeline::helper::ProcessStateGuard` — the helper
#     subprocess that re-installs the parent's `within [dir: …]`
#     override into its own process cwd before invoking `uumain`.
#     Helper-only; never run from the parent's evaluator.
# Basedir discipline: every XDG base directory (config/data/cache/state
# /bin) is resolved by `crate::path::basedir::resolve_xdg`, which reads the
# `XDG_*_HOME` override only when it is absolute (per the spec's
# relative-values-are-ignored rule) and otherwise joins the home-relative
# default.  A hand-rolled `std::env::var_os("XDG_STATE_HOME")` skips that
# rule and accepts a relative override — the bypass class the
# canonicalisation discipline above guards against, applied to basedirs.
# `std::env::var_os` is the path-valued env reader, so it is banned: the
# resolver itself carries an `#[allow]`, and the genuine non-basedir
# readers (terminal/sandbox/PATH probes, the helper's env snapshot, test
# scaffolding) carry the same attribute with a reason at the call site.
#
# Host-env discipline: `$HOME` / `$USER` have two readings — the *dynamic
# environment* a `within [env: …]` overlay shadows (language semantics:
# pseudo-vars, tilde expansion, RAL_PATH), and the *host fact* of who
# launched the process and where the tool itself lives (shell seeding,
# ral's own rc/plugin/state locations, other binaries).  Semantics code
# threads the shell's overlay through `crate::path::home` /
# `crate::path::user_name`; the host reading is `crate::host::home` /
# `user`, banned below so every host-level read is a written decision
# with an `#[allow]` reason saying why the overlay must not apply.
# Calling `path::home(&EnvVars::new())` directly would dodge the lint;
# that spelling is reserved for the two `host` accessors and is enforced
# by review, like `PathBuf::from` above.
#
# Child-wait discipline: every ral-managed child goes through
# `crate::process::ChildHandle`.  `into_watch` hands the wait to the
# process-wide reaper, which answers a stop with `SIGCONT` on its own and
# never lets one reach a subscriber; `reap` is the blocking reap after a
# confirmed kill, `try_reap` the non-blocking poll `hatch.rs`'s table
# uses directly.  A raw `Child::try_wait` reports a stopped child as
# still running (no `WUNTRACED`), which is exactly `try_reap`'s point —
# the reaper, not the poller, owns the stop.  The few legitimate raw
# waiters (post-SIGKILL reap inside `ChildHandle`, one-shot sandbox/bwrap
# respawn, test harnesses) carry an `#[allow]` with a reason at the call
# site.
#
# Apple spawn-lock discipline: see `core/src/process/spawn_lock.rs`'s module
# doc. Doors carry an `#[allow]` with a reason at the call site.
#
# Syscall-site discipline: every filesystem and process *constructor* the
# model can reach is banned so that all I/O passes through a reviewed
# syscall site — the place where ral turns an outside name into a handle
# (see decisions/260619_surface-reads-writes-execs).  The handle is the
# capability, so banning construction suffices — once the only way to get
# a `File`, a `ReadDir`, or a `Command` is such a site, every read, write,
# spawn, and exec is accounted for.  `cap_primitives`' handle-relative
# twins are banned on the same ground: `path/walk.rs` is where a name
# becomes a judged object, and a cap-std call outside it opens an object
# no grant saw.  Each banned constructor's call sites split in two, and
# the `#[allow]`'s `reason` records which:
#   * SURFACING — the model's own turn-time I/O, fused with a surface
#     card.  Redirect read/write: the frames in
#     `runtime/command/redirect.rs` (`open_file`,
#     `install_stdin_redirect`) drive the opens, which `path/walk.rs`
#     performs on the located object; external and bundled exec, reached
#     from `build_command` in `runtime/command/process.rs`, surfaced at
#     `process/launch.rs` (`Launch::new`) and `sandbox/linux.rs`
#     (`make_command_with_policy`); grep + edit in
#     `exarch/src/shell_eval/builtins.rs` (`search_tree`, the edit
#     read/write-atomic helpers).
#   * REASONED-SILENT — fs/process work that is *not* the model's
#     turn-time data I/O and raises no card by design: canonicalisation,
#     `which`/PATH probes, module loading (`source`/`use`), stat
#     predicates (`exists`/`list-dir`), capability-policy loading, sandbox
#     respawn/exec, the prelude bake, and exarch/ral infrastructure.  The
#     `reason` states *why* it is silent, so silence is a written decision.
# The `reason` opens with a `[surface:<slug>]` or `[silent:<slug>]` tag
# (`[test]` on test scaffolding), so `reason = "[` is the one grep that
# finds every site.  A `disallowed_methods` is enforced workspace-wide via
# `[workspace.lints.clippy]` in the root Cargo.toml; the vendored
# `ral-ripgrep-core` opts out with its own `[lints.clippy] all = "allow"`
# to stay upstream-diffable, so it is exempt by design.  A meta-test
# (`core/tests/syscall_sites.rs`) pins the production allow set so a new,
# unaccounted site fails CI.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "Use crate::path::canon::canonicalise_strict (file must exist) or canonicalise_lenient (ancestor-walk fallback). Both name the call-site intent and keep the discipline of one canonicaliser per shape." },
    { path = "std::env::current_dir", reason = "Use Shell::cwd() — process CWD must not be cached in any shell-scoped store; that's how PWD went stale across thunks." },
    { path = "std::env::set_current_dir", reason = "ral's `cd` mutates Shell::logical_cwd, not the process cwd. Process-cwd writes are reserved for the pipeline helper subprocess and the in-process uutils save/restore — both carry an explicit #[allow]." },
    { path = "std::path::Path::new", reason = "Use a named helper in crate::path (is_absolute / exists / basename / path_within_str / …) so the path-construction rule lives in one place. FFI glue and env-var lifting may #[allow] at the call site with a reason." },
    { path = "std::process::Child::wait", reason = "Use crate::process::ChildHandle::{into_watch, reap} — the reaper owns the wait and answers a stop itself; reap is the blocking reap after a confirmed kill. Sandbox respawn and tests #[allow] explicitly." },
    { path = "std::process::Child::try_wait", reason = "Use crate::process::ChildHandle::try_reap — hatch.rs's table is its one caller; a stopped child reading as still running is the point, since the reaper answers the stop for any pid it watches." },
    { path = "std::env::var_os", reason = "An XDG basedir read goes through crate::path::basedir::resolve_xdg, which ignores relative overrides per the spec. Other path-valued env reads (terminal/sandbox/PATH probes, helper env snapshot, tests) #[allow] explicitly with a reason." },
    { path = "ral_core::host::home", reason = "Host-only $HOME read — a `within [env: …]` overlay does not apply. Inside language semantics, thread the shell's overlay through crate::path::home; genuine host-level reads (boot seeding, ral's own config/state locations, other binaries) #[allow] with a reason." },
    { path = "ral_core::host::user", reason = "Host-only $USER read — a `within [env: …]` overlay does not apply. Inside language semantics, thread the shell's overlay through crate::path::user_name; host-level reads #[allow] with a reason." },
    { path = "ignore::WalkBuilder::build", reason = "Directory walks go through exarch::shell_eval::builtins::cancellable, the single sanctioned build() site (it carries the one #[allow(clippy::disallowed_methods)]); each walk loop polls ral_core::process::check per raw entry so a long walk honours the tool-timeout / Esc cancel the bare ignore::Walk ignores." },
    { path = "std::fs::File::open", reason = "I/O goes through a reviewed syscall site (see surface-reads-writes-execs). A model read is the redirect site in runtime/command/redirect.rs that surfaces a read card; every other open is a reasoned-silent site that #[allow]s with a reason saying why it raises no card." },
    { path = "std::fs::File::create", reason = "I/O goes through a reviewed syscall site. A model write is the redirect site in runtime/command/redirect.rs that surfaces a write card; other creates #[allow] with a silence reason." },
    { path = "std::fs::File::create_new", reason = "I/O goes through a reviewed syscall site. Exclusive create is a surfacing or a reasoned-silent site; #[allow] at the call site with a reason naming which." },
    { path = "std::fs::OpenOptions::open", reason = "I/O goes through a reviewed syscall site. The redirect sites build their OpenOptions; any other OpenOptions::open #[allow]s with a reason saying it is a surfacing or a reasoned-silent site." },
    { path = "std::fs::read", reason = "I/O goes through a reviewed syscall site. grep + edit read in exarch::shell_eval::builtins (surfacing); every other one-shot read is a reasoned-silent site that #[allow]s with a reason." },
    { path = "std::fs::read_to_string", reason = "I/O goes through a reviewed syscall site. Module loading (source/use) is the documented reasoned-silent residual; other read_to_string sites #[allow] with a reason naming the surface or the silence." },
    { path = "std::fs::write", reason = "I/O goes through a reviewed syscall site. A model write surfaces at the redirect / edit sites; every other one-shot write #[allow]s with a silence reason." },
    { path = "std::fs::read_dir", reason = "I/O goes through a reviewed syscall site. `list-dir` and other directory reads are reasoned-silent stat sites; each #[allow]s with a reason saying why it is not turn-time data I/O." },
    { path = "std::fs::metadata", reason = "I/O goes through a reviewed syscall site. The atomic-write mode-preservation stat is a surfacing site's sub-step; `exists`/predicate stats are reasoned-silent. #[allow] with a reason naming which." },
    { path = "std::fs::symlink_metadata", reason = "I/O goes through a reviewed syscall site. The atomic-commit mode-preservation stat is a surfacing site's sub-step; other symlink stats are reasoned-silent. #[allow] with a reason." },
    { path = "std::fs::read_link", reason = "I/O goes through a reviewed syscall site. Symlink reads are reasoned-silent path-resolution work; #[allow] with a reason." },
    { path = "std::fs::remove_file", reason = "I/O goes through a reviewed syscall site. File removal is a reasoned-silent infrastructure act (temp cleanup, atomic-write rollback), not turn-time model I/O; #[allow] with a reason." },
    { path = "std::fs::remove_dir_all", reason = "I/O goes through a reviewed syscall site. Recursive removal is reasoned-silent infrastructure; #[allow] with a reason." },
    { path = "std::fs::create_dir_all", reason = "I/O goes through a reviewed syscall site. Directory creation is reasoned-silent infrastructure (basedir/scratch setup), not model I/O; #[allow] with a reason." },
    { path = "std::fs::rename", reason = "I/O goes through a reviewed syscall site. The atomic-commit rename is a surfacing write site's commit step; other renames are reasoned-silent. #[allow] with a reason naming which." },
    { path = "std::fs::copy", reason = "I/O goes through a reviewed syscall site. A file copy is reasoned-silent infrastructure unless it is the model's own exec image; #[allow] with a reason." },
    { path = "std::fs::set_permissions", reason = "I/O goes through a reviewed syscall site. The atomic-commit mode restore is a surfacing write site's sub-step; other chmods are reasoned-silent. #[allow] with a reason naming which." },
    # `cap_primitives::fs` is `std::fs` with the walk made explicit: every
    # entry takes the directory handle to act relative to.  The whole surface
    # is banned rather than the handful `path/walk.rs` uses today, because a
    # ban that only names the current callers is what let the fs site move out
    # from under this list once already.  `allow-invalid` on the four
    # platform-gated symlink entries: each resolves on one OS only, and the
    # ban has to be written for the OS where the site is real.
    { path = "cap_primitives::fs::access", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::canonicalize", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::copy", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::create_dir", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::hard_link", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::is_file_read_write", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::open", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::open_ambient", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::open_ambient_dir", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::open_dir", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::open_dir_nofollow", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::open_parent_dir", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::read_base_dir", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::read_dir", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::read_link", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::read_link_contents", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::remove_dir", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
