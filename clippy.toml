# Each ban below names the helper that replaces it.  A legitimate exception is
# a typed site, `site!(Silent::Variant, call)` (`lint/site.rs`): it wraps one
# call, and its `Surface` (raises a card) or `Silent` (raises none) variant
# names the place and documents why it is exempt.  The exemption is an
# `#[expect]`, so a site that wraps no banned call is an error.  Call sites are
# deliberately not listed here, since every such list this file has carried
# drifted out of date: the enums of each crate are the enumeration, and the
# durable rationale is in the wiki.
#
# Test, example and build code is not what the bans protect, and carries one
# blanket `#[allow]` per unit (an integration-test crate root, a `#[cfg(test)]`
# module, an example, a build script), never one inside it.
# `core/tests/sites.rs` checks that no other exemption exists.
#
# Syscall sites: every filesystem and process constructor is banned, so each
# call that turns an outside name into a handle is a typed site.  The handle is
# the capability, so banning construction suffices.  `cap_primitives` is banned
# entire rather than the part `path/walk.rs` uses today: a ban naming only the
# current callers is what let the fs site move out from under this list once
# already.
#
# The files a program touches on its own account, outside any shell, go through
# `ral_core::own`: what it keeps for itself, what the user writes at the places
# it chooses, and what the user names to it.  Every `std::fs` ban points there.
# The four calls that take a name the user gave (`read_named`, `open_named`,
# `kind_named`, `create_named`) are banned in turn: each caller is a typed site
# that says whose name it is.
# A name a model gives is opened only by the walk, `crate::path::walk`.  The
# host's environment is read only through `ral_core::host::{var, var_os,
# vars_os}`, so every `std::env` ban points there.
#
# `PathBuf::from` and `EnvVars::home` are disciplines with no
# ban: each resolves through a trait impl clippy cannot scope to a single
# reachable function, so an entry would never fire.  Enforced by review.  So is
# reading, through `host::var`, a variable that the `host::home` and
# `host::user` bans guard.
#
# `libc::_exit` is unbanned on purpose, despite `exit` and `abort` below: it is
# mandatory in a signal handler and in a post-`fork` child, where `exit` would
# run atexit hooks under a handler or destructors over the parent's state.
# Both callers are in `core/src/process/signal/unix.rs`.
#
# `allow-invalid` marks an entry that resolves on one OS only, or only where a
# crate's features reach it (a `windows_sys` function that a crate's
# `windows-sys` features do not enable is unreachable in that crate).  The ban
# still has to be written for the OS and the crate where the call is real, so
# the entry stays and the unresolvable-here case is declared rather than warned
# about.
#
# Enforced workspace-wide by `[workspace.lints.clippy]` in the root Cargo.toml.
# The vendored `ral-ripgrep-core` opts out with `[lints.clippy] all = "allow"`
# to stay upstream-diffable.
disallowed-methods = [
