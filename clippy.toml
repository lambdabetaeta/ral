# Each ban below names the helper that replaces it; a legitimate exception
# carries `#[allow(clippy::disallowed_methods, reason = "…")]` at the call
# site.  Call sites are deliberately not listed here — every such list this
# file has carried drifted out of date — so the reasons at the sites are the
# enumeration, and the durable rationale is in the wiki.
#
# Syscall sites: every filesystem and process constructor is banned, so each
# call that turns an outside name into a handle is a reviewed site.  The
# handle is the capability, so banning construction suffices.  `cap_primitives`
# is banned entire rather than the part `path/walk.rs` uses today: a ban naming
# only the current callers is what let the fs site move out from under this
# list once already.  A `reason` opens with `[surface:<slug>]` (raises a card),
# `[silent:<slug>]` (raises none, and says why), or `[test]`, so `reason = "["`
# finds every site and `core/tests/syscall_sites.rs` pins the set.
#
# `PathBuf::from` and `EnvVars::home` are disciplines with no
# ban: each resolves through a trait impl clippy cannot scope to a single
# reachable function, so an entry would never fire.  Enforced by review.
#
# So is the rule that a syscall's allow carries a tag.  `disallowed_methods` is
# one lint for every ban in this file, and an allow names the lint, not the
# ban, so a `path-form:` or `native:` allow over an `fs::read` silences it too,
# and no tag reaches the manifest.  A reviewer reading a new untagged allow
# checks that it covers no syscall.
#
# `libc::_exit` is unbanned on purpose, despite `exit` and `abort` below: it is
# mandatory in a signal handler and in a post-`fork` child, where `exit` would
# run atexit hooks under a handler or destructors over the parent's state.
# Both callers are in `core/src/process/signal/unix.rs`.
#
# `allow-invalid` marks an entry that resolves on one OS only.  The ban still
# has to be written for the OS where the call is real, so the entry stays and
# the unresolvable-here case is declared rather than warned about.
#
# Enforced workspace-wide by `[workspace.lints.clippy]` in the root Cargo.toml.
# The vendored `ral-ripgrep-core` opts out with `[lints.clippy] all = "allow"`
# to stay upstream-diffable.
