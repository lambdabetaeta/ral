    { path = "cap_primitives::fs::access", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::canonicalize", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::copy", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::create_dir", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::hard_link", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::is_file_read_write", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::open", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
    { path = "cap_primitives::fs::open_ambient", reason = "Route it through crate::path::walk, where Shell::locate judges the object the handle then opens." },
