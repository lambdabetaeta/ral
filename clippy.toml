# Each ban below names the helper that replaces it; a legitimate exception
# carries `#[allow(clippy::disallowed_methods, reason = "…")]` at the call
# site.  Call sites are deliberately not listed here — every such list this
# file has carried drifted out of date — so the reasons at the sites are the
# enumeration, and the durable rationale is in the wiki.
#
# Syscall sites: every filesystem and process constructor is banned, so each
# call that turns an outside name into a handle is a reviewed site.  The
# handle is the capability, so banning construction suffices.  `cap_primitives`
# is banned entire rather than the part `path/walk.rs` uses today: a ban naming
# only the current callers is what let the fs site move out from under this
# list once already.  A `reason` opens with `[surface:<slug>]` (raises a card),
# `[silent:<slug>]` (raises none, and says why), or `[test]`, so `reason = "["`
# finds every site and `core/tests/syscall_sites.rs` pins the set.
#
# `PathBuf::from` and `path::home(&EnvVars::new())` are disciplines with no
# ban: each resolves through a trait impl clippy cannot scope to a single
# reachable function, so an entry would never fire.  Enforced by review.
#
# `libc::_exit` is unbanned on purpose, despite `exit` and `abort` below: it is
# mandatory in a signal handler and in a post-`fork` child, where `exit` would
# run atexit hooks under a handler or destructors over the parent's state.
# Both callers are in `core/src/process/signal/unix.rs`.
#
# `allow-invalid` marks an entry that resolves on one OS only.  The ban still
# has to be written for the OS where the call is real, so the entry stays and
# the unresolvable-here case is declared rather than warned about.
#
# Enforced workspace-wide by `[workspace.lints.clippy]` in the root Cargo.toml.
# The vendored `ral-ripgrep-core` opts out with `[lints.clippy] all = "allow"`
# to stay upstream-diffable.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "Use crate::path::canon::canonicalise_strict (file must exist) or canonicalise_lenient (ancestor-walk fallback) — one canonicaliser per shape, intent named at the call site." },
    { path = "std::env::current_dir", reason = "Use Shell::cwd(). Process CWD is OS-global and races every parallel ral thread; caching it in a shell-scoped store is how PWD went stale across thunks." },
    { path = "std::env::set_current_dir", reason = "ral's `cd` mutates Shell::logical_cwd, not the process cwd. A process-cwd write is subprocess setup only." },
    { path = "std::path::Path::new", reason = "Use a named helper in crate::path (is_absolute / exists / basename / path_within_str / …) so the resolution rule lives in one place. FFI glue and env-var lifting #[allow] with a reason." },
    { path = "std::process::Child::wait", reason = "Use crate::process::ChildHandle::{into_watch, reap} — the reaper owns the wait and answers a stop itself; reap is the blocking reap after a confirmed kill." },
    { path = "std::process::Child::try_wait", reason = "Use crate::process::ChildHandle::try_reap. A raw try_wait reports a stopped child as still running (no WUNTRACED), which is the point: the reaper answers the stop for any pid it watches." },
    { path = "std::env::var_os", reason = "An XDG basedir read goes through crate::path::basedir::resolve_xdg, which ignores a relative override per the spec. Other path-valued env reads #[allow] with a reason." },
    { path = "ral_core::host::home", reason = "Host-only $HOME read — a `within [env: …]` overlay does not apply. In language semantics thread the shell's overlay through crate::path::home instead." },
    { path = "ral_core::host::user", reason = "Host-only $USER read — a `within [env: …]` overlay does not apply. In language semantics thread the shell's overlay through crate::path::user_name instead." },
    { path = "ignore::WalkBuilder::build", reason = "Use exarch::shell_eval::builtins::cancellable, the one sanctioned build() site: its walk polls ral_core::process::check per entry, so a long walk honours the tool-timeout / Esc cancel a bare ignore::Walk ignores." },
    { path = "std::fs::File::open", reason = "A model read is the redirect site that surfaces a read card; any other open is reasoned-silent." },
    { path = "std::fs::File::create", reason = "A model write is the redirect site that surfaces a write card; any other create is reasoned-silent." },
    { path = "std::fs::File::create_new", reason = "Exclusive create: #[allow] with a reason naming the surface or the silence." },
    { path = "std::fs::OpenOptions::open", reason = "The redirect sites build their own OpenOptions; any other one #[allow]s with a reason." },
    { path = "std::fs::read", reason = "grep and edit read surfacing in exarch::shell_eval::builtins; every other one-shot read is reasoned-silent." },
    { path = "std::fs::read_to_string", reason = "Module loading (source/use) is the documented silent residual; other sites #[allow] with a reason." },
    { path = "std::fs::write", reason = "A model write surfaces at the redirect and edit sites; every other one-shot write is reasoned-silent." },
    { path = "std::fs::read_dir", reason = "`list-dir` and other directory reads are silent stat sites, not turn-time data I/O." },
    { path = "std::fs::metadata", reason = "The atomic-write mode-preservation stat is a write site's sub-step; predicate stats are silent." },
    { path = "std::fs::symlink_metadata", reason = "The atomic-commit mode-preservation stat is a write site's sub-step; other symlink stats are silent." },
    { path = "std::fs::read_link", reason = "Symlink reads are silent path-resolution work." },
    { path = "std::fs::remove_file", reason = "Removal is silent infrastructure — temp cleanup, atomic-write rollback — not turn-time model I/O." },
    { path = "std::fs::remove_dir_all", reason = "Recursive removal is silent infrastructure." },
    { path = "std::fs::create_dir_all", reason = "Directory creation is silent infrastructure — basedir and scratch setup — not model I/O." },
    { path = "std::fs::rename", reason = "The atomic-commit rename is a write site's commit step; other renames are silent." },
    { path = "std::fs::copy", reason = "A copy is silent infrastructure unless it is the model's own exec image." },
    { path = "std::fs::set_permissions", reason = "The atomic-commit mode restore is a write site's sub-step; other chmods are silent." },
    # `cap_primitives::fs` is `std::fs` with the walk made explicit: every entry
