    { path = "cap_primitives::fs::rename", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::reopen", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::set_permissions", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::set_symlink_permissions", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::set_times", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::set_times_nofollow", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::stat", reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::symlink", allow-invalid = true, reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::symlink_contents", allow-invalid = true, reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::symlink_dir", allow-invalid = true, reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "cap_primitives::fs::symlink_file", allow-invalid = true, reason = "Route it through crate::path::walk — Shell::locate judges the object the handle then opens. Any other cap-std fs call opens an object no grant judged; #[allow] with a [surface:…] or [silent:…] reason." },
    { path = "std::process::Command::new", reason = "Process spawning goes through a reviewed syscall site. The model's external exec is the site at crate::process::Launch::new that surfaces an exec card; every other Command::new (sandbox respawn, which probes, infra subprocesses) is reasoned-silent and #[allow]s with a reason." },
    { path = "os_pipe::pipe", reason = "Use crate::process::cloexec_pipe — Apple sets CLOEXEC after pipe(), and a concurrent fork on another thread inherits the window." },
    { path = "std::os::unix::net::UnixStream::pair", reason = "Use crate::process::cloexec_socketpair — same window." },
    { path = "std::process::Command::spawn", reason = "Use crate::process::spawn — the fork door; see spawn_lock.rs." },
    { path = "std::process::Command::output", reason = "Use crate::process::output — spawns through the fork door and waits outside it; see spawn_lock.rs." },
    { path = "std::process::Command::status", reason = "Use crate::process::status — spawns through the fork door and waits outside it; see spawn_lock.rs." },
    # `allow-invalid` because the path is unix-only: on a Windows build the
    # trait does not exist, and clippy warns about every entry it cannot
    # resolve.  The ban still has to be written — the site it guards is real
    # wherever there is an `exec` to guard — so the entry stays and the
    # unresolvable-here case is declared rather than warned about.
    { path = "std::os::unix::process::CommandExt::exec", allow-invalid = true, reason = "An exec image replaces the process and must be a reviewed syscall site. The sandbox respawn exec is reasoned-silent (the surface fired before the handoff); #[allow] with a reason." },
]
