[package]
name = "vm-manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "vm_manager"
path = "src/lib.rs"

[dependencies]
tempfile = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
guest-abi = { path = "../guest-abi" }
# Pure Rust permits cross-checking without a target C toolchain; only decoding is needed.
ruzstd = { workspace = true }
sha2   = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2               = "0.6"
objc2-foundation    = "0.3"
objc2-virtualization = "0.3"
block2              = "0.6"
dispatch2           = { version = "0.3", features = ["block2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Hypervisor",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    # ReadFile, WriteFile and ConnectNamedPipe require OVERLAPPED even for blocking calls.
    "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# The smoke example needs the frame protocol without search builtins.
ral-core = { path = "../core", default-features = false }
