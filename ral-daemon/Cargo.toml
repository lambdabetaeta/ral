[package]
name = "ral-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "ral_daemon"
path = "src/lib.rs"

[[bin]]
name = "ral-daemon"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process", "mount", "fs", "system", "time"] }
