[package]
edition = "2024"
name = "edtui"
version = "0.11.7"
authors = ["preiter <phil.reiter93@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A TUI based vim inspired editor"
readme = "README.md"
keywords = [
    "ratatui",
    "tui",
    "editor",
    "text",
    "vim",
]
license = "MIT"
repository = "https://github.com/preiter93/edtui"

[features]
