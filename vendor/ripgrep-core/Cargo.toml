[package]
name = "ral-ripgrep-core"
version = "15.1.0+ral.0"
edition = "2024"
rust-version = "1.85"
license = "Unlicense OR MIT"
publish = false

[features]
pcre2 = ["grep/pcre2"]

[lib]
name = "ral_ripgrep_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.75"
bstr = "1.7.0"
grep = "0.4.1"
ignore = "0.4.24"
lexopt = "0.3.0"
log = "0.4.5"
serde_json = "1.0.23"
termcolor = "1.1.0"
textwrap = { version = "0.16.0", default-features = false }

[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies]
tikv-jemallocator = "0.6.0"

# Vendored ripgrep fork: kept upstream-diffable, so we don't apply the
# workspace clippy lints here.
[lints.clippy]
all = "allow"
