[package]
name = "exarch"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[lib]
name = "exarch"
path = "src/lib.rs"

[[bin]]
name = "exarch"
path = "src/main.rs"

[features]
default = ["coreutils"]
coreutils = ["ral-core/coreutils"]
diffutils = ["ral-core/diffutils"]
ripgrep = ["ral-core/ripgrep"]

[dependencies]
ral-core   = { path = "../core", features = ["grep", "coreutils"] }
blake3     = "1"
genai      = "0.6.5"
reqwest    = { version = "0.13", features = ["json", "form"] }
rustls     = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures-util = { version = "0.3", default-features = false }
libc       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
clap       = { workspace = true }
ratatui      = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm    = { version = "0.29", features = ["bracketed-paste"] }
ansi-to-tui  = "8"
pulldown-cmark = { version = "0.13", default-features = false }
syntect      = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face     = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
os_info    = { version = "3", default-features = false }
unicode-width = "0.2"
ratatui-textarea = "0.9"
textwrap = "0.16"
fff-search = "0.9"
grep       = "0.4"
ignore     = "0.4"
tempfile   = "3.27"
base64     = { workspace = true }
sha2       = "0.10"
getrandom  = "0.2"
# Line-level structured diffing: `edit` computes one canonical whole-file
# diff (original vs final) and emits a single grouped-hunk card.  Default
# features only — `from_lines`/`grouped_ops`/`iter_changes` are line-level;
# `inline`/`unicode`/`bytes` are not pulled in.
similar    = "2"
# Calendar arithmetic for scheduled-wakeup cron evaluation (next occurrence
# in the host-local timezone, DST-aware).  Already compiled in transitively
# via ral-core -> uu_date -> jiff-icu -> jiff; declaring it directly resolves
# to the same built crate at zero marginal cost.
jiff       = "0.2"

# Unix-only bundled tools (id / kill / stat / timeout / test / tac).  Pulled
# in through `ral-core/coreutils-unix-only` only on Unix targets — the
# upstream uu_* crates depend on uucore::{entries, process, signals}
# which do not compile on Windows.
[target.'cfg(unix)'.dependencies]
ral-core = { path = "../core", features = ["grep", "coreutils", "coreutils-unix-only"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
ral-core = { path = "../core" }

[dev-dependencies]
ctor = "1"
