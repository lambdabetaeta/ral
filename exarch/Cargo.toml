[package]
name = "exarch"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "exarch"
path = "src/lib.rs"

[[bin]]
name = "exarch"
path = "src/main.rs"

[features]
default = ["coreutils"]
coreutils = ["ral-core/coreutils"]
diffutils = ["ral-core/diffutils"]
ripgrep = ["ral-core/ripgrep"]
test-util = ["ral-core/test-util"]

[dependencies]
ral-core   = { path = "../core", features = ["coreutils"] }
# A Sync RefCell for the cells a desk handler reaches through Arc<dyn Host>: a conflicting borrow is same-thread reentrancy, never contention.
atomic_refcell = "0.1"
blake3     = "1"
genai      = "0.7.0-rc.2"
reqwest    = { version = "0.13", features = ["json", "form"] }
rustls     = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures-util = { version = "0.3", default-features = false }
libc       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
clap       = { workspace = true }
shlex      = { workspace = true }
ratatui      = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm    = { version = "0.29", features = ["bracketed-paste"] }
pulldown-cmark = { version = "0.13", default-features = false }
# LaTeX laid out on a character grid ([`tui::md`]'s `math_rows`).
# `default-features = false` takes the renderer alone, leaving the crate's own
# ratatui behind so this tree keeps one; the fork carries that feature split,
# offered upstream to decisiongraph/tui-math. Drop the fork once it lands.
tui-math = { git = "https://github.com/lambdabetaeta/tui-math", rev = "96ec5fe3cc0fd03298e75534dc69dcb6d57636fb", default-features = false }
syntect      = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face     = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
os_info    = { version = "3", default-features = false }
unicode-width = "0.2"
textwrap = "0.16"
fff-search = "0.11"
prompt-editor = { path = "../prompt-editor" }
grep       = "0.4"
ignore     = "0.4"
# `transcript `grep`'s pattern dialect, the same one ral's own `re-*` family
# speaks; ral-core already compiles it, so this adds no build.
regex      = "1"
tempfile   = "3.27"
base64     = { workspace = true }
sha2       = { workspace = true }
getrandom  = "0.4"
# Line-level structured diffing: every file change is one grouped-hunk diff,
# taken by `Diff::between`. `inline` and `unicode` serve its intra-line word
# diff (`iter_inline_changes_deadline`/`iter_strings_lossy`).
similar    = { version = "3", features = ["inline", "unicode"] }
# Calendar arithmetic for scheduled-wakeup cron evaluation (next occurrence
# in the host-local timezone, DST-aware), and the instant a provider says an
# allowance resets at, which a record carries as itself (`serde`).  Already
# compiled in transitively via ral-core -> uu_date -> jiff-icu -> jiff;
# declaring it directly resolves to the same built crate.
jiff       = { version = "0.2", features = ["serde"] }
gray_matter = { version = "0.3", default-features = false, features = ["yaml"] }
# The computer's own credential manager (Keychain / Credential Manager /
# Secret Service), behind one entry type; `provider::keychain` is the only
# caller.
keyring    = "4.1"
fd-lock = "4"

# Unix-only bundled tools (id / kill / stat / timeout / test / tac).  Pulled
# in through `ral-core/coreutils-unix-only` only on Unix targets — the
# upstream uu_* crates depend on uucore::{entries, process, signals}
# which do not compile on Windows.
[target.'cfg(unix)'.dependencies]
ral-core = { path = "../core", features = ["coreutils", "coreutils-unix-only"] }
rustix = { workspace = true, features = ["process", "stdio", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
ral-core = { path = "../core" }

[dev-dependencies]
ral-core = { path = "../core", features = ["test-util"] }
ctor = "1"
