[workspace]
resolver = "2"
members = ["core", "ral", "ral-sh", "exarch", "prompt-editor", "vendor/ripgrep-core"]

# Shared third-party versions.  Member crates point at these with
# `dep = { workspace = true }` so a version bump happens in one place.
# `windows-sys` carries only its version here — each crate selects its own
# Win32 feature set on top, since they differ (core needs the full sandbox
# surface, ral the console, exarch the console plus browser handoff).
[workspace.dependencies]
serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
csv        = "1"
libc       = "0.2"
# Unix-only syscall wrappers.  Pinned to 0.31 — the version the rest of the
# graph already resolves — so every member rides one nix.  (0.29 also lingers
# transitively via mac_address/termwiz, which pin it; nix majors are breaking,
# so that one is not ours to move.)
nix        = "0.31"
rustix     = "1"
clap       = { version = "4", features = ["derive"] }
base64     = "0.22"
shlex      = "2.0"
windows-sys = "0.61"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Deliberate opt-outs from pedantic/nursery (priority 0 overrides the groups).
# Each is advisory-by-design ceremony, not a defect signal, in this codebase:
#   must_use_candidate / return_self_not_must_use — #[must_use] earns its meaning
#     by being selective; annotating every pure accessor is noise.
#   missing_const_for_fn — `const` is an API commitment with no payoff on internal
#     code never evaluated in a const context.
#   redundant_pub_crate — an explicit `pub(crate)` documents reach more clearly.
#   option_if_let_else — the `map_or_else` rewrite frequently reads worse.
#   items_after_statements — a local `fn`/`const` beside its use is a locality idiom.
#   too_many_lines — splitting for a line count alone harms readable dispatch/draw code.
#   similar_names / many_single_char_names — intentional domain pairs and math locals.
# The vendored crate (vendor/ripgrep-core) does not inherit these lints.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_const_for_fn = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
disallowed_methods = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "unwind"  # must unwind: catch_unwind in driver loop needs it to recover from tool panics

# Same codegen as release, but with debug info kept and stripping disabled
# so samply / perf can resolve symbols.  LTO stays on so inlining matches
# release; the debuginfo just makes the inline tree readable.

[profile.profiling]
inherits = "release"
strip = false
debug = "full"
