[workspace]
resolver = "2"
members = ["core", "ral", "ral-sh", "exarch", "prompt-editor", "vendor/ripgrep-core"]

# Shared third-party versions.  Member crates point at these with
# `dep = { workspace = true }` so a version bump happens in one place.
# `windows-sys` carries only its version here — each crate selects its own
# Win32 feature set on top, since they differ (core needs the full sandbox
# surface, ral the console, exarch the console plus browser handoff).
[workspace.dependencies]
serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
csv        = "1"
libc       = "0.2"
clap       = { version = "4", features = ["derive"] }
base64     = "0.22"
shlex      = "2.0"
windows-sys = "0.61"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
disallowed_methods = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "unwind"  # must unwind: catch_unwind in driver loop needs it to recover from tool panics

# Same codegen as release, but with debug info kept and stripping disabled
# so samply / perf can resolve symbols.  LTO stays on so inlining matches
# release; the debuginfo just makes the inline tree readable.

[profile.profiling]
inherits = "release"
strip = false
debug = "full"
