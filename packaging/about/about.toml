# cargo-about 0.9.3 configuration for the THIRDPARTY-* notices; see
# packaging/README.md. Clarifications pin each licence text by checksum, so a
# changed text stops generation until it is reviewed.

# Priority order: a crate offering several is listed under the first.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# Neither is linked into a shipped binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Unpublished crates are first-party (publish = false in Cargo.toml).
private = { ignore = true }
workarounds = ["chrono"]

