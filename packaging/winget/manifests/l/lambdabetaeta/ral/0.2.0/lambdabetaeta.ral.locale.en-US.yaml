ShortDescription: A shell grounded on algebraic effects
Description: >-
  ral is a shell built on one idea: running an external command is performing
  an algebraic effect. Pipelines are typed (bytes vs. values), and authority
  is scoped and can only shrink (grant). Every sandboxed command runs under
  real OS-level confinement on every platform: an AppContainer LowBox token
  on Windows, Seatbelt on macOS, bubblewrap on Linux. This package installs
  ral.exe with the bundled coreutils, diffutils, grep and ripgrep subset,
  since Windows has no system coreutils to fall back on; it does not include
  ral-sh, which has no Windows equivalent.
