ShortDescription: A shell grounded on algebraic effects
Description: >-
  ral is a shell built on one idea: running an external command is performing
  an algebraic effect. Pipelines are typed (bytes vs. values), authority is
  scoped and can only shrink (grant), and every sandboxed command runs under
  real OS-level confinement (AppContainer on Windows, Seatbelt on macOS,
  bubblewrap on Linux). This package installs the bare ral.exe; it does not
  include ral-sh, which has no Windows equivalent.
